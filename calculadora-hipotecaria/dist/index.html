  precioUF,
  creditoBaseUF,
  gastos,
  esDFL2 = false,
  esViviendaSocial = false,
  financiarGastos = false,
}) {
  const tasaImpuesto = esViviendaSocial
    ? 0
    : esDFL2
      ? gastos.tasaImpuestoMutuoDFL2
      : gastos.tasaImpuestoMutuo;

  const conservadorUF = Math.min(
    precioUF * gastos.tasaConservador,
    gastos.topeConservadorUF,
  );

  // Todo lo que no depende del monto del crédito.
  const fijos = [
    { concepto: 'Tasación', uf: gastos.tasacionUF },
    { concepto: 'Estudio de títulos y redacción de escritura', uf: gastos.estudioTitulosUF },
    { concepto: 'Notaría (mutuo)', uf: gastos.notariaUF },
    { concepto: 'Notaría (compraventa)', uf: gastos.gastosNotarialesCompraventaUF },
    { concepto: 'Inscripción en el Conservador de Bienes Raíces', uf: conservadorUF },
  ];
  const totalFijosUF = fijos.reduce((a, g) => a + g.uf, 0);

  // Si financias los gastos, el crédito crece y con él el impuesto al mutuo.
  const montoCreditoUF = financiarGastos
    ? (creditoBaseUF + totalFijosUF) / (1 - tasaImpuesto)
    : creditoBaseUF;

  const impuestoMutuoUF = montoCreditoUF * tasaImpuesto;

  const detalle = [
    ...fijos,
    {
      concepto: `Impuesto de timbres y estampillas (${cl(tasaImpuesto * 100, 1)}%)`,
      uf: impuestoMutuoUF,
    },
  ];
  const totalUF = totalFijosUF + impuestoMutuoUF;

  // Los gastos operacionales suelen caer entre 1,3% y 1,5% del monto financiado.
  // Fuera de ahí, casi siempre es que algún supuesto quedó mal cargado.
  const porcentajeDelCredito = montoCreditoUF > 0 ? totalUF / montoCreditoUF : 0;
  let alerta = null;
  if (montoCreditoUF > 0 && (porcentajeDelCredito < 0.008 || porcentajeDelCredito > 0.025)) {
    alerta =
      `Los gastos operacionales dan ${cl(porcentajeDelCredito * 100, 2)}% del crédito, ` +
      'fuera del rango habitual de 1,3%–1,5%. Revisa las tarifas que cargaste.';
  }

  return {
    detalle,
    totalUF,
    impuestoMutuoUF,
    tasaImpuestoAplicada: tasaImpuesto,
    montoCreditoUF,
    porcentajeDelCredito,
    alerta,
    // Lo que pagas de tu bolsillo al firmar, sin contar el pie.
    desembolsoInicialUF: financiarGastos ? 0 : totalUF,
  };
}

/**
 * @typedef {Object} ResultadoCredito
 * @property {number} montoCreditoUF
 * @property {number} pieUF
 * @property {number} ltv
 * @property {number} cuotaUF cuota pelada, constante
 * @property {number} dividendoPrimerMesUF
 * @property {number} dividendoUltimoMesUF
 * @property {number} dividendoPromedioUF
 * @property {number} totalInteresUF
 * @property {number} totalSegurosUF
 * @property {number} totalDesembolsadoUF todo lo que sale de tu bolsillo, abonos incluidos
 * @property {number} costoTotalUF pie + gastos + todos los dividendos
 * @property {number|null} caeAnual
 * @property {Array} filas tabla mes a mes con el dividendo completo
 * @property {Object} gastosOperacionales
 */

/**
 * Calcula un crédito completo, de principio a fin.
 *
 * @param {Object} e entrada normalizada
 * @returns {ResultadoCredito}
 */
function calcularCredito(e) {
  const precioUF = e.precioUF;
  const pieUF = e.pieUF != null ? e.pieUF : precioUF * e.piePorcentaje;
  const creditoBaseUF = Math.max(0, precioUF - pieUF);

  const gastosOperacionales = calcularGastosOperacionales({
    precioUF,
    creditoBaseUF,
    gastos: e.gastos,
    esDFL2: e.esDFL2,
    esViviendaSocial: e.esViviendaSocial,
    financiarGastos: e.financiarGastos,
  });

  const montoCreditoUF = gastosOperacionales.montoCreditoUF;
  const n = Math.round(e.plazoAnios * 12);
  const i = tasaMensual(e.tasaAnual, e.convencionTasa || 'nominal');

  const amort = tablaAmortizacion({
    capital: montoCreditoUF,
    i,
    n,
    abonoMensual: e.abonoMensualUF || 0,
    abonoAnual: e.abonoAnualUF || 0,
    mesAbonoAnual: e.mesAbonoAnual || 12,
    modoAbono: e.modoAbono || 'plazo',
  });

  // El desgravamen se cobra sobre el saldo insoluto, así que baja mes a mes.
  // El de incendio y sismo se cobra sobre el valor de tasación y es fijo.
  const valorTasacionUF = e.valorTasacionUF || precioUF;
  const incendioMensualUF = valorTasacionUF * e.tasaIncendioSismoMensual;
  const comisionUF = e.comisionAdminMensualUF || 0;

  let saldoAnterior = montoCreditoUF;
  let totalSegurosUF = 0;
  const filas = amort.filas.map((f) => {
    const desgravamenUF = saldoAnterior * e.tasaDesgravamenMensual;
    saldoAnterior = f.saldo;
    const segurosUF = desgravamenUF + incendioMensualUF + comisionUF;
    totalSegurosUF += segurosUF;
    return {
      ...f,
      desgravamenUF,
      incendioUF: incendioMensualUF,
      comisionUF,
      segurosUF,
      // El dividendo es lo que estás obligado a pagar: cuota + seguros.
      // El abono extraordinario es voluntario, así que va aparte. Mezclarlos
      // inflaría la carga financiera y la CAE de quien decide prepagar.
      dividendoUF: f.cuota + segurosUF,
      desembolsoUF: f.cuota + segurosUF + f.abonoExtra,
    };
  });

  const dividendos = filas.map((f) => f.dividendoUF);
  const desembolsos = filas.map((f) => f.desembolsoUF);
  const totalDesembolsadoUF = desembolsos.reduce((a, d) => a + d, 0);

  return {
    montoCreditoUF,
    pieUF,
    ltv: precioUF > 0 ? montoCreditoUF / precioUF : 0,
    plazoMeses: amort.meses,
    tasaMensualAplicada: i,
    cuotaUF: cuotaFrancesa(montoCreditoUF, i, n),
    dividendoPrimerMesUF: dividendos[0] || 0,
    dividendoUltimoMesUF: dividendos[dividendos.length - 1] || 0,
    dividendoPromedioUF: dividendos.length ? dividendos.reduce((a, d) => a + d, 0) / dividendos.length : 0,
    incendioMensualUF,
    totalInteresUF: amort.totalInteres,
    totalSegurosUF,
    totalDesembolsadoUF,
    costoTotalUF: pieUF + gastosOperacionales.desembolsoInicialUF + totalDesembolsadoUF,
    // La CAE se calcula sobre el desembolso real, abonos incluidos: es el flujo
    // de caja que efectivamente ocurre.
    caeAnual: cae(montoCreditoUF, gastosOperacionales.totalUF, desembolsos),
    filas,
    gastosOperacionales,
  };
}

/**
 * Cuánto capital soportas con un dividendo tope, considerando que los seguros
 * se comen parte de ese tope.
 *
 * Es la pregunta inversa: no "cuánto pago por esta casa" sino "qué casa alcanzo
 * con lo que puedo pagar". Se resuelve iterando porque el seguro de incendio
 * depende del precio, que a su vez depende del crédito.
 *
 * @param {Object} p
 * @param {number} p.dividendoMaximoUF
 * @param {number} p.tasaAnual
 * @param {number} p.plazoAnios
 * @param {number} p.piePorcentaje
 * @param {number} p.tasaDesgravamenMensual
 * @param {number} p.tasaIncendioSismoMensual
 * @param {number} [p.comisionAdminMensualUF]
 * @param {'nominal'|'efectiva'} [p.convencionTasa]
 */
function capacidadDeCompra({
  dividendoMaximoUF,
  tasaAnual,
  plazoAnios,
  piePorcentaje,
  tasaDesgravamenMensual,
  tasaIncendioSismoMensual,
  comisionAdminMensualUF = 0,
  convencionTasa = 'nominal',
}) {
  const i = tasaMensual(tasaAnual, convencionTasa);
  const n = Math.round(plazoAnios * 12);
  const factor = i === 0 ? 1 / n : i / (1 - Math.pow(1 + i, -n));
  const ltv = 1 - piePorcentaje;

  // Punto fijo: el dividendo del primer mes es
  //   C·factor + C·desgravamen + precio·incendio + comisión
  // y precio = C / ltv. Converge en pocas vueltas.
  let credito = 0;
  for (let k = 0; k < 100; k++) {
    const precio = ltv > 0 ? credito / ltv : 0;
    const disponible = dividendoMaximoUF - precio * tasaIncendioSismoMensual - comisionAdminMensualUF;
    const nuevo = disponible <= 0 ? 0 : disponible / (factor + tasaDesgravamenMensual);
    if (Math.abs(nuevo - credito) < 1e-9) { credito = nuevo; break; }
    credito = nuevo;
  }

  const creditoUF = Math.max(0, credito);
  const precioUF = ltv > 0 ? creditoUF / ltv : 0;
  return {
    creditoMaximoUF: creditoUF,
    precioMaximoUF: precioUF,
    pieNecesarioUF: precioUF * piePorcentaje,
  };
}

/* ===== src/engine/programas.js ===== */
/**
 * FOGAES Vivienda y Subsidio al Dividendo.
 *
 * Los dos programas se anunciaron juntos y se suelen presentar como una sola
 * cosa, pero son independientes: FOGAES te deja comprar con menos pie, el
 * Subsidio al Dividendo te baja la tasa. Puedes calificar para uno, para el
 * otro, para ambos o para ninguno.
 */





/**
 * @typedef {Object} EvaluacionPrograma
 * @property {boolean} elegible
 * @property {string[]} motivos razones por las que NO califica (vacío si califica)
 * @property {string[]} advertencias cosas que sí dependen de ti verificar
 * @property {string} efecto qué te cambia si califica
 */

/**
 * Evalúa la elegibilidad para FOGAES Vivienda.
 *
 * @param {Object} p
 * @param {number} p.precioUF
 * @param {boolean} p.esPrimeraVivienda
 * @param {boolean} p.recibioSubsidioPrevio
 * @param {boolean} p.enRegistroDeudoresPensiones
 * @param {boolean} p.yaUsoFogaes
 * @returns {EvaluacionPrograma}
 */
function evaluarFogaes({
  precioUF,
  esPrimeraVivienda,
  recibioSubsidioPrevio,
  enRegistroDeudoresPensiones,
  yaUsoFogaes,
}) {
  const cfg = PROGRAMAS.fogaes;
  const motivos = [];

  if (precioUF > cfg.topeValorViviendaUF) {
    motivos.push(
      `La vivienda vale UF ${precioUF.toLocaleString('es-CL')} y el tope es UF ${cfg.topeValorViviendaUF.toLocaleString('es-CL')}.`,
    );
  }
  if (!esPrimeraVivienda) {
    motivos.push('FOGAES es solo para primera vivienda: no puedes tener otra vivienda habitacional.');
  }
  if (recibioSubsidioPrevio) {
    motivos.push('Ya recibiste un subsidio o beneficio estatal para financiar vivienda.');
  }
  if (enRegistroDeudoresPensiones) {
    motivos.push('Estar en el Registro Nacional de Deudores de Pensiones de Alimentos te deja fuera.');
  }
  if (yaUsoFogaes) {
    motivos.push('FOGAES se puede usar una sola vez.');
  }

  return {
    elegible: motivos.length === 0,
    motivos,
    advertencias: [
      'Igual tienes que pasar la evaluación crediticia del banco: FOGAES no la reemplaza.',
      'Los cupos son limitados y se asignan por orden de llegada.',
    ],
    efecto: `Financiamiento de hasta ${cfg.ltvMaximo * 100}% del valor, o sea pie de ${(1 - cfg.ltvMaximo) * 100}% en vez de 20%.`,
    ltvMaximo: cfg.ltvMaximo,
    fuente: cfg.fuente,
  };
}

/**
 * Evalúa la elegibilidad para el Subsidio al Dividendo (rebaja de tasa).
 *
 * @param {Object} p
 * @param {number} p.precioUF
 * @param {boolean} p.esViviendaNueva
 * @param {string} [p.fechaPromesa] ISO 'YYYY-MM-DD'
 * @returns {EvaluacionPrograma}
 */
function evaluarSubsidioDividendo({ precioUF, esViviendaNueva, fechaPromesa }) {
  const cfg = PROGRAMAS.subsidioDividendo;
  const motivos = [];

  if (precioUF > cfg.topeValorViviendaUF) {
    motivos.push(
      `La vivienda vale UF ${precioUF.toLocaleString('es-CL')} y el tope es UF ${cfg.topeValorViviendaUF.toLocaleString('es-CL')}.`,
    );
  }
  if (cfg.exigeViviendaNueva && !esViviendaNueva) {
    motivos.push('El subsidio aplica solo a viviendas nuevas, no a usadas.');
  }
  if (fechaPromesa && fechaPromesa < cfg.promesaDesde) {
    motivos.push(`La promesa de compraventa debe ser del ${cfg.promesaDesde} en adelante.`);
  }

  return {
    elegible: motivos.length === 0,
    motivos,
    advertencias: [
      `Los cupos son limitados (${cfg.cuposTotales.toLocaleString('es-CL')} en total) y se asignan por orden de llegada.`,
      `El plazo para postular vence el ${cfg.postulacionHasta}.`,
    ],
    efecto: `Rebaja de ${cl(cfg.rebajaTasaAnual * 10000, 0)} puntos base en la tasa (${cl(cfg.rebajaTasaAnual * 100, 2)} puntos porcentuales).`,
    rebajaTasaAnual: cfg.rebajaTasaAnual,
    fuente: cfg.fuente,
  };
}

/**
 * Evalúa ambos programas de una vez y devuelve la tasa y el LTV que
 * efectivamente puedes usar.
 */
function evaluarProgramas(perfil) {
  const fogaes = evaluarFogaes(perfil);
  const subsidio = evaluarSubsidioDividendo(perfil);

  const usaFogaes = fogaes.elegible && perfil.quiereUsarFogaes !== false;
  const usaSubsidio = subsidio.elegible && perfil.quiereUsarSubsidio !== false;

  return {
    fogaes,
    subsidioDividendo: subsidio,
    usaFogaes,
    usaSubsidio,
    ltvMaximo: usaFogaes ? PROGRAMAS.fogaes.ltvMaximo : 0.80,
    tasaEfectiva: usaSubsidio
      ? Math.max(0, perfil.tasaAnual - PROGRAMAS.subsidioDividendo.rebajaTasaAnual)
      : perfil.tasaAnual,
  };
}

/**
 * Cuántos años te toma juntar un pie mayor, considerando que mientras ahorras
 * el precio de la vivienda también sube.
 *
 * Es la pregunta que decide si FOGAES te conviene o si te conviene esperar:
 * comprar hoy con 10% te endeuda más, pero esperar puede significar perseguir
 * un precio que arranca.
 *
 * @returns {{anios: number|null, precioFuturoUF: number, pieObjetivoUF: number}}
 */
function aniosParaJuntarPie({
  precioUF,
  piePorcentajeObjetivo,
  ahorroActualUF,
  ahorroMensualUF,
  plusvaliaAnualReal = 0.02,
  rendimientoAhorroAnualReal = 0.01,
  maxAnios = 40,
}) {
  const gMes = Math.pow(1 + plusvaliaAnualReal, 1 / 12) - 1;
  const rMes = Math.pow(1 + rendimientoAhorroAnualReal, 1 / 12) - 1;

  let ahorro = ahorroActualUF;
  let precio = precioUF;

  if (ahorro >= precio * piePorcentajeObjetivo) {
    return { anios: 0, precioFuturoUF: precio, pieObjetivoUF: precio * piePorcentajeObjetivo };
  }
  if (ahorroMensualUF <= 0 && rMes <= gMes) {
    return { anios: null, precioFuturoUF: precio, pieObjetivoUF: precio * piePorcentajeObjetivo };
  }

  for (let mes = 1; mes <= maxAnios * 12; mes++) {
    ahorro = ahorro * (1 + rMes) + ahorroMensualUF;
    precio = precio * (1 + gMes);
    if (ahorro >= precio * piePorcentajeObjetivo) {
      return {
        anios: mes / 12,
        precioFuturoUF: precio,
        pieObjetivoUF: precio * piePorcentajeObjetivo,
      };
    }
  }
  // Nunca lo alcanza: el precio corre más rápido que el ahorro.
  return { anios: null, precioFuturoUF: precio, pieObjetivoUF: precio * piePorcentajeObjetivo };
}

/**
 * La comparación honesta de FOGAES.
 *
 * FOGAES se promociona como "compra con 10% de pie". Lo que no se dice con la
 * misma fuerza es que eso significa pedir un crédito 12,5% más grande: el
 * dividendo sube y los intereses totales suben bastante. A cambio compras
 * antes, y ese "antes" tiene valor si los precios están subiendo.
 *
 * Esta función pone las dos alternativas lado a lado sobre la misma propiedad
 * para que decidas con los números a la vista.
 *
 * @param {Object} entrada entrada de calcularCredito, sin piePorcentaje
 * @param {Object} ahorro { ahorroActualUF, ahorroMensualUF, plusvaliaAnualReal }
 */
function compararFogaes(entrada, ahorro = {}) {
  const conFogaes = calcularCredito({ ...entrada, piePorcentaje: 0.10, pieUF: null });
  const sinFogaes = calcularCredito({ ...entrada, piePorcentaje: 0.20, pieUF: null });

  const espera = aniosParaJuntarPie({
    precioUF: entrada.precioUF,
    piePorcentajeObjetivo: 0.20,
    ahorroActualUF: ahorro.ahorroActualUF || 0,
    ahorroMensualUF: ahorro.ahorroMensualUF || 0,
    plusvaliaAnualReal: ahorro.plusvaliaAnualReal ?? 0.02,
    rendimientoAhorroAnualReal: ahorro.rendimientoAhorroAnualReal ?? 0.01,
  });

  const deltaDividendoUF = conFogaes.dividendoPrimerMesUF - sinFogaes.dividendoPrimerMesUF;
  const deltaInteresUF = conFogaes.totalInteresUF - sinFogaes.totalInteresUF;
  const deltaPieUF = sinFogaes.pieUF - conFogaes.pieUF;

  return {
    conFogaes,
    sinFogaes,
    deltaDividendoUF,
    deltaInteresUF,
    deltaPieUF,
    espera,
    lectura: [
      `Con FOGAES entras con UF ${cl(deltaPieUF, 0)} menos de pie.`,
      `A cambio pagas UF ${cl(deltaDividendoUF, 2)} más cada mes.`,
      `Y a lo largo del crédito pagas UF ${cl(deltaInteresUF, 0)} más de intereses.`,
      espera.anios === null
        ? 'Con tu ritmo de ahorro actual no alcanzarías el 20% de pie: el precio sube más rápido que tu ahorro.'
        : `Juntar el 20% de pie te tomaría ${cl(espera.anios, 1)} años, y para entonces la vivienda costaría alrededor de UF ${cl(espera.precioFuturoUF, 0)}.`,
    ],
  };
}

/**
 * Efecto aislado del Subsidio al Dividendo sobre el mismo crédito.
 */
function compararSubsidioDividendo(entrada) {
  const conSubsidio = calcularCredito({
    ...entrada,
    tasaAnual: Math.max(0, entrada.tasaAnual - PROGRAMAS.subsidioDividendo.rebajaTasaAnual),
  });
  const sinSubsidio = calcularCredito(entrada);
  return {
    conSubsidio,
    sinSubsidio,
    ahorroMensualUF: sinSubsidio.dividendoPrimerMesUF - conSubsidio.dividendoPrimerMesUF,
    ahorroTotalUF: sinSubsidio.totalDesembolsadoUF - conSubsidio.totalDesembolsadoUF,
  };
}

/* ===== src/engine/impuestos.js ===== */
/**
 * Lo tributario: Global Complementario, el beneficio del Art. 55 bis, DFL2 y
 * el impuesto a la ganancia de capital al vender.
 *
 * El Art. 55 bis en particular casi nunca aparece en los simuladores, y para un
 * comprador de renta media puede valer varios cientos de miles de pesos al año.
 * No cambia tu dividendo, pero sí el costo real del crédito.
 */




/**
 * Impuesto Global Complementario, calculado tramo a tramo.
 *
 * Se suma el impuesto de cada tramo en vez de usar la fórmula
 * "renta × factor − rebaja": da exactamente lo mismo, pero no depende de
 * constantes de rebaja que puedan quedar desactualizadas.
 *
 * @param {number} rentaAnualCLP renta bruta imponible anual, en pesos
 * @param {number} valorUTM
 */
function impuestoGlobalComplementario(rentaAnualCLP, valorUTM) {
  const uta = valorUTM * 12;
  const rentaUTA = rentaAnualCLP / uta;

  let impuestoUTA = 0;
  let anterior = 0;
  let tasaMarginal = 0;

  for (const tramo of TRAMOS_IGC_UTA) {
    if (rentaUTA <= anterior) break;
    const enTramo = Math.min(rentaUTA, tramo.hasta) - anterior;
    impuestoUTA += enTramo * tramo.tasa;
    tasaMarginal = tramo.tasa;
    anterior = tramo.hasta;
  }

  const impuesto = impuestoUTA * uta;
  return {
    rentaUTA,
    impuesto,
    tasaMarginal,
    tasaEfectiva: rentaAnualCLP > 0 ? impuesto / rentaAnualCLP : 0,
  };
}

/**
 * Renta bruta imponible anual de un trabajador a honorarios.
 *
 * Se descuentan los gastos presuntos (30% con tope de 15 UTA) y las
 * cotizaciones previsionales obligatorias.
 */
function rentaImponibleHonorarios({ brutoAnualCLP, valorUTM, usarGastosPresuntos = true }) {
  const uta = valorUTM * 12;
  const gastosPresuntos = usarGastosPresuntos
    ? Math.min(brutoAnualCLP * GASTOS_PRESUNTOS.tasa, GASTOS_PRESUNTOS.topeUTA * uta)
    : 0;

  const baseCotizable = brutoAnualCLP * COTIZACIONES_INDEPENDIENTE.baseImponible;
  const cotizaciones = baseCotizable * COTIZACIONES_INDEPENDIENTE.tasaTotalAproximada;

  const rentaImponible = Math.max(0, brutoAnualCLP - gastosPresuntos - cotizaciones);

  return {
    brutoAnualCLP,
    gastosPresuntos,
    topeGastosPresuntosAlcanzado: brutoAnualCLP * GASTOS_PRESUNTOS.tasa > GASTOS_PRESUNTOS.topeUTA * uta,
    cotizaciones,
    rentaImponible,
  };
}

/**
 * Beneficio del Art. 55 bis: rebaja de los intereses hipotecarios.
 *
 * Reglas:
 *   - Solo intereses efectivamente pagados en el año. No capital, no seguros,
 *     no comisiones.
 *   - Tope de 8 UTA.
 *   - Bajo 90 UTA de renta bruta anual, la rebaja es completa.
 *   - Entre 90 y 150 UTA se degrada de forma lineal.
 *   - Sobre 150 UTA no hay beneficio.
 *
 * El factor de degradación es (250 − 1,667 × renta en UTA) / 100, que da 100%
 * en 90 UTA y 0% en 150 UTA.
 *
 * @param {Object} p
 * @param {number} p.interesesAnualesCLP
 * @param {number} p.rentaBrutaImponibleAnualCLP
 * @param {number} p.valorUTM
 */
function beneficio55bis({ interesesAnualesCLP, rentaBrutaImponibleAnualCLP, valorUTM }) {
  const uta = valorUTM * 12;
  const rentaUTA = rentaBrutaImponibleAnualCLP / uta;
  const topeCLP = ART_55_BIS.topeUTA * uta;

  const factor = acotar((250 - 1.667 * rentaUTA) / 100, 0, 1);
  const rebajaBase = Math.min(interesesAnualesCLP, topeCLP);
  const rebaja = rebajaBase * factor;

  const sinBeneficio = impuestoGlobalComplementario(rentaBrutaImponibleAnualCLP, valorUTM);
  const conBeneficio = impuestoGlobalComplementario(
    Math.max(0, rentaBrutaImponibleAnualCLP - rebaja),
    valorUTM,
  );
  const ahorro = sinBeneficio.impuesto - conBeneficio.impuesto;

  let motivo;
  if (rentaUTA >= ART_55_BIS.rentaSinBeneficioUTA) {
    motivo = `Tu renta bruta anual (${cl(rentaUTA, 1)} UTA) supera las 150 UTA: no tienes derecho al beneficio.`;
  } else if (rentaUTA <= ART_55_BIS.rentaSinRestriccionUTA) {
    motivo = 'Tu renta está bajo 90 UTA, así que puedes rebajar los intereses completos hasta el tope de 8 UTA.';
  } else {
    motivo = `Tu renta está entre 90 y 150 UTA, así que la rebaja se reduce al ${cl(factor * 100, 0)}%.`;
  }

  return {
    rentaUTA,
    factor,
    topeCLP,
    interesesConsiderados: rebajaBase,
    topeAlcanzado: interesesAnualesCLP > topeCLP,
    rebaja,
    ahorroTributarioAnual: ahorro,
    tasaMarginal: sinBeneficio.tasaMarginal,
    aplica: ahorro > 0,
    motivo,
  };
}

/**
 * Aplica el Art. 55 bis año a año sobre la tabla de amortización.
 * Los intereses son altos al principio y bajan con el tiempo, así que el
 * beneficio se concentra en los primeros años.
 *
 * @param {Array} filas filas de la tabla de amortización (en UF)
 * @param {Object} p
 */
function beneficio55bisPorAnio(filas, { rentaBrutaImponibleAnualCLP, valorUTM, valorUF, anios = 10 }) {
  const resultado = [];
  let acumulado = 0;

  for (let anio = 1; anio <= anios; anio++) {
    const desde = (anio - 1) * 12;
    const hasta = anio * 12;
    const tramo = filas.slice(desde, hasta);
    if (tramo.length === 0) break;

    const interesesUF = tramo.reduce((a, f) => a + f.interes, 0);
    const b = beneficio55bis({
      interesesAnualesCLP: interesesUF * valorUF,
      rentaBrutaImponibleAnualCLP,
      valorUTM,
    });
    acumulado += b.ahorroTributarioAnual;
    resultado.push({
      anio,
      interesesUF,
      interesesCLP: interesesUF * valorUF,
      rebaja: b.rebaja,
      ahorro: b.ahorroTributarioAnual,
      topeAlcanzado: b.topeAlcanzado,
    });
  }

  return { filas: resultado, ahorroAcumulado: acumulado };
}

/**
 * DFL2: si la vivienda califica, cambian tres cosas relevantes.
 */
function evaluarDFL2({ superficieUtilM2, viviendasDFL2QueYaTiene = 0, esPersonaNatural = true }) {
  const motivos = [];
  if (superficieUtilM2 > DFL2.superficieMaximaM2) {
    motivos.push(`La superficie útil es ${superficieUtilM2} m² y el máximo es ${DFL2.superficieMaximaM2} m².`);
  }
  if (esPersonaNatural && viviendasDFL2QueYaTiene >= DFL2.maxViviendasPersonaNatural) {
    motivos.push(
      `Como persona natural, los beneficios del DFL2 alcanzan hasta ${DFL2.maxViviendasPersonaNatural} viviendas y ya tienes ${viviendasDFL2QueYaTiene}.`,
    );
  }
  const califica = motivos.length === 0;
  return {
    califica,
    motivos,
    beneficios: califica ? DFL2.beneficios : [],
    arriendoExentoDeRenta: califica && esPersonaNatural,
    fuente: DFL2.fuente,
    nota: 'El DFL2 lo determina el permiso de edificación de la propiedad, no su superficie a ojo. Pídele el certificado al vendedor.',
  };
}

/**
 * Impuesto a la ganancia de capital al vender, para persona natural.
 * Hay una exención de 8.000 UF de por vida; sobre el exceso, 10% de impuesto
 * único.
 */
function impuestoGananciaCapital({ gananciaUF, exencionYaUsadaUF = 0 }) {
  if (gananciaUF <= 0) {
    return { gananciaUF, exencionAplicadaUF: 0, gananciaAfectaUF: 0, impuestoUF: 0 };
  }
  const exencionDisponible = Math.max(0, GANANCIA_CAPITAL.exencionVitaliciaUF - exencionYaUsadaUF);
  const exencionAplicada = Math.min(gananciaUF, exencionDisponible);
  const afecta = gananciaUF - exencionAplicada;
  return {
    gananciaUF,
    exencionDisponibleUF: exencionDisponible,
    exencionAplicadaUF: exencionAplicada,
    gananciaAfectaUF: afecta,
    impuestoUF: afecta * GANANCIA_CAPITAL.tasaUnica,
    tasa: GANANCIA_CAPITAL.tasaUnica,
  };
}

/**
 * Contribuciones (impuesto territorial). El avalúo fiscal y la tasa dependen
 * de la propiedad y la comuna, así que entran como datos.
 */
function contribuciones({ avaluoFiscalCLP, tasaAnual = 0.01, exencionCLP = 0, esDFL2 = false }) {
  const base = Math.max(0, avaluoFiscalCLP - exencionCLP);
  const bruto = base * tasaAnual;
  // El DFL2 trae rebaja del impuesto territorial por un período.
  const neto = esDFL2 ? bruto * 0.5 : bruto;
  return {
    baseAfectaCLP: base,
    anualCLP: neto,
    mensualCLP: neto / 12,
    exento: base === 0,
    rebajaDFL2Aplicada: esDFL2 && bruto > 0,
  };
}

/* ===== src/engine/ingresos.js ===== */
/**
 * Capacidad de pago según cómo generas tus ingresos.
 *
 * Un dependiente con sueldo fijo y un independiente a honorarios con el mismo
 * promedio anual NO son evaluados igual por el banco, ni corren el mismo riesgo.
 * El banco reconoce del orden del 70%–80% de lo que declara un independiente, y
 * el independiente además enfrenta meses malos que el dependiente no tiene.
 * Este módulo modela las dos cosas.
 */




/**
 * Tasa de retención de boletas de honorarios para un año dado.
 * Sube todos los años por la Ley 21.133 hasta llegar a 17% en 2028, así que tu
 * líquido mensual baja aunque factures exactamente lo mismo.
 */
function retencionDelAnio(anio) {
  const anios = Object.keys(RETENCION_HONORARIOS).map(Number).sort((a, b) => a - b);
  if (anio <= anios[0]) return RETENCION_HONORARIOS[anios[0]];
  if (anio >= anios[anios.length - 1]) return RETENCION_HONORARIOS[anios[anios.length - 1]];
  return RETENCION_HONORARIOS[anio];
}

/**
 * Cuánto te llega efectivamente a la cuenta por una boleta, y cuánto de eso
 * es realmente tuyo una vez que la Operación Renta cobre las cotizaciones.
 *
 * La retención no es un impuesto perdido: financia tus cotizaciones y el
 * eventual impuesto. Pero para efectos de flujo de caja mensual, no la tienes.
 */
function liquidoHonorarios({ brutoMensual, anio = new Date().getFullYear() }) {
  const tasaRetencion = retencionDelAnio(anio);
  const retenido = brutoMensual * tasaRetencion;
  const liquidoRecibido = brutoMensual - retenido;

  // Cotizaciones obligatorias: se calculan sobre el 80% del bruto.
  const baseCotizable = brutoMensual * COTIZACIONES_INDEPENDIENTE.baseImponible;
  const cotizaciones = baseCotizable * COTIZACIONES_INDEPENDIENTE.tasaTotalAproximada;

  return {
    brutoMensual,
    tasaRetencion,
    retenido,
    liquidoRecibido,
    cotizacionesEstimadas: cotizaciones,
    // Lo que queda si además provisionas las cotizaciones mes a mes.
    disponibleRealMensual: liquidoRecibido - Math.max(0, cotizaciones - retenido),
  };
}

/**
 * Proyecta cómo cambia tu líquido a medida que sube la retención hasta 2028.
 * Facturas lo mismo y recibes menos: conviene verlo antes de comprometerte a
 * un dividendo por 25 años.
 */
function proyectarRetencion({ brutoMensual, desdeAnio = 2026, hastaAnio = 2028 }) {
  const filas = [];
  for (let anio = desdeAnio; anio <= hastaAnio; anio++) {
    const l = liquidoHonorarios({ brutoMensual, anio });
    filas.push({
      anio,
      tasaRetencion: l.tasaRetencion,
      liquidoRecibido: l.liquidoRecibido,
    });
  }
  const primero = filas[0];
  const ultimo = filas[filas.length - 1];
  return {
    filas,
    caidaLiquidaMensual: primero.liquidoRecibido - ultimo.liquidoRecibido,
  };
}

/**
 * Estadística de tus boletas reales.
 *
 * El promedio no basta: lo que te quiebra no es el mes promedio sino la racha
 * mala. Por eso se calcula el peor trimestre efectivo y la dispersión.
 *
 * @param {number[]} boletas montos mensuales, del más antiguo al más reciente
 */
function analizarBoletas(boletas) {
  const datos = (boletas || []).filter((x) => typeof x === 'number' && !Number.isNaN(x));
  if (datos.length === 0) return null;

  const n = datos.length;
  const suma = datos.reduce((a, b) => a + b, 0);
  const promedio = suma / n;

  const ordenados = [...datos].sort((a, b) => a - b);
  const mediana = n % 2
    ? ordenados[(n - 1) / 2]
    : (ordenados[n / 2 - 1] + ordenados[n / 2]) / 2;

  const varianza = datos.reduce((a, x) => a + (x - promedio) ** 2, 0) / n;
  const desviacion = Math.sqrt(varianza);
  const coefVariacion = promedio > 0 ? desviacion / promedio : 0;

  // Peor y mejor ventana de 3 meses consecutivos.
  let peorTrimestre = Infinity;
  let mejorTrimestre = -Infinity;
  if (n >= 3) {
    for (let k = 0; k + 3 <= n; k++) {
      const s = datos[k] + datos[k + 1] + datos[k + 2];
      peorTrimestre = Math.min(peorTrimestre, s);
      mejorTrimestre = Math.max(mejorTrimestre, s);
    }
  } else {
    peorTrimestre = suma * (3 / n);
    mejorTrimestre = suma * (3 / n);
  }

  return {
    meses: n,
    promedio,
    mediana,
    minimo: ordenados[0],
    maximo: ordenados[n - 1],
    desviacion,
    coefVariacion,
    mesesEnCero: datos.filter((x) => x === 0).length,
    peorTrimestrePromedioMensual: peorTrimestre / 3,
    mejorTrimestrePromedioMensual: mejorTrimestre / 3,
    // Cuánto cae tu peor racha respecto del promedio.
    caidaPeorTrimestre: promedio > 0 ? 1 - (peorTrimestre / 3) / promedio : 0,
  };
}

/**
 * Meses de dividendo que conviene tener guardados antes de firmar.
 *
 * Regla de oficio, no de ley: 6 meses de piso, y sube con la volatilidad
 * medida de tus ingresos. Un dependiente estable está bien con 6; un freelance
 * con ingresos que varían mucho necesita más cerca de 12–18.
 */
function colchonRecomendado({ modalidad, coefVariacion = 0 }) {
  if (modalidad === 'dependiente') return 6;
  const meses = Math.round(6 + 24 * coefVariacion);
  return Math.min(18, Math.max(6, meses));
}

/**
 * Renta que el banco te va a reconocer.
 *
 * @param {Object} p
 * @param {'dependiente'|'honorarios'|'mixto'|'socio'} p.modalidad
 * @param {number} [p.sueldoLiquidoMensual] para dependiente y mixto
 * @param {number} [p.promedioBoletasMensual] promedio de tus boletas, bruto
 * @param {number} [p.rentaLiquidaF22Anual] renta líquida de tu Formulario 22
 * @param {number} [p.retirosMensuales] para socio de empresa
 * @param {number} [p.factorCastigo] cuánto reconoce el banco de lo variable
 */
function rentaAcreditable({
  modalidad,
  sueldoLiquidoMensual = 0,
  promedioBoletasMensual = 0,
  rentaLiquidaF22Anual = 0,
  retirosMensuales = 0,
  factorCastigo = EVALUACION_BANCARIA.factorCastigoHonorarios,
}) {
  const detalle = [];

  if (modalidad === 'dependiente') {
    detalle.push({ concepto: 'Sueldo líquido', monto: sueldoLiquidoMensual, castigo: 1 });
    return {
      total: sueldoLiquidoMensual,
      detalle,
      nota: 'Con contrato y liquidaciones, el banco reconoce tu líquido completo.',
    };
  }

  // Para lo variable, el banco cruza el promedio de boletas contra tu F22 y se
  // queda con el menor de los dos. Después le aplica su castigo.
  const baseF22 = rentaLiquidaF22Anual > 0 ? rentaLiquidaF22Anual / 12 : Infinity;
  const baseVariable = Math.min(
    promedioBoletasMensual || Infinity,
    modalidad === 'socio' ? (retirosMensuales || Infinity) : Infinity,
    baseF22,
  );
  const variable = Number.isFinite(baseVariable) ? baseVariable : 0;
  const variableCastigada = variable * factorCastigo;

  if (modalidad === 'mixto' && sueldoLiquidoMensual > 0) {
    detalle.push({ concepto: 'Sueldo líquido', monto: sueldoLiquidoMensual, castigo: 1 });
  }
  detalle.push({
    concepto: modalidad === 'socio' ? 'Retiros de la empresa' : 'Honorarios',
    monto: variable,
    castigo: factorCastigo,
    montoReconocido: variableCastigada,
  });

  const total = (modalidad === 'mixto' ? sueldoLiquidoMensual : 0) + variableCastigada;

  return {
    total,
    detalle,
    baseAntesDeCastigo: variable,
    factorCastigo,
    limitadoPorF22: Number.isFinite(baseF22) && baseF22 < (promedioBoletasMensual || Infinity),
    nota: Number.isFinite(baseF22) && baseF22 < (promedioBoletasMensual || Infinity)
      ? 'Tu F22 declara menos que tu promedio de boletas, así que el banco usará el F22. Es el caso típico cuando descuentas gastos.'
      : `El banco reconoce ${cl(factorCastigo * 100, 0)}% de tus ingresos variables.`,
  };
}

/**
 * Dividendo máximo que soportas y, con eso, la carga financiera resultante.
 *
 * @param {Object} p
 * @param {number} p.rentaAcreditableMensual
 * @param {number} [p.otrasDeudasMensuales] cuotas de otros créditos y tarjetas
 * @param {number} [p.cargaMaxima] fracción de la renta, por defecto 25%
 */
function capacidadDePago({
  rentaAcreditableMensual,
  otrasDeudasMensuales = 0,
  cargaMaxima = EVALUACION_BANCARIA.cargaFinancieraMaxima,
}) {
  const cupoTotal = rentaAcreditableMensual * cargaMaxima;
  const dividendoMaximo = Math.max(0, cupoTotal - otrasDeudasMensuales);
  return {
    cupoTotal,
    otrasDeudasMensuales,
    dividendoMaximo,
    cargaMaxima,
    consumidoPorOtrasDeudas: cupoTotal > 0 ? otrasDeudasMensuales / cupoTotal : 0,
  };
}

/** Carga financiera efectiva de un dividendo concreto. */
function cargaFinanciera({ dividendoMensual, otrasDeudasMensuales = 0, rentaAcreditableMensual }) {
  if (!rentaAcreditableMensual) return { valor: null, semaforo: 'sin-dato' };
  const valor = (dividendoMensual + otrasDeudasMensuales) / rentaAcreditableMensual;
  const semaforo = valor <= 0.25 ? 'verde' : valor <= 0.32 ? 'ambar' : 'rojo';
  return {
    valor,
    semaforo,
    mensaje:
      semaforo === 'verde'
        ? 'Dentro de lo que los bancos aceptan sin problema.'
        : semaforo === 'ambar'
          ? 'En el límite. Algunos bancos lo aprueban, otros no, y te deja poco margen.'
          : 'Sobre lo que los bancos suelen aceptar, y sobre lo que es prudente.',
  };
}

/**
 * Prueba de estrés: qué pasa si tus ingresos caen.
 *
 * Para un dependiente esto es hipotético. Para un freelance es martes.
 * Se prueban dos escenarios: una caída porcentual que tú eliges, y tu peor
 * trimestre real medido de tus propias boletas.
 */
function pruebaDeEstres({
  dividendoMensual,
  otrasDeudasMensuales = 0,
  rentaAcreditableMensual,
  ingresoRealMensual,
  caidaPorcentual = 0.30,
  mesesDeCaida = 6,
  ahorroLiquidoUF = 0,
  peorTrimestrePromedioMensual = null,
}) {
  const compromisoMensual = dividendoMensual + otrasDeudasMensuales;
  const base = ingresoRealMensual || rentaAcreditableMensual;

  const escenario = (nombre, ingresoEstresado, descripcion) => {
    const deficitMensual = Math.max(0, compromisoMensual - ingresoEstresado);
    const deficitTotal = deficitMensual * mesesDeCaida;
    const mesesQueAguanta = deficitMensual > 0
      ? ahorroLiquidoUF / deficitMensual
      : Infinity;
    return {
      nombre,
      descripcion,
      ingresoEstresado,
      cargaFinanciera: ingresoEstresado > 0 ? compromisoMensual / ingresoEstresado : Infinity,
      deficitMensual,
      deficitTotal,
      mesesQueAguanta,
      sobrevive: deficitMensual === 0 || mesesQueAguanta >= mesesDeCaida,
    };
  };

  const escenarios = [
    escenario(
      `Caída de ${cl(caidaPorcentual * 100, 0)}%`,
      base * (1 - caidaPorcentual),
      `Tus ingresos caen ${cl(caidaPorcentual * 100, 0)}% durante ${mesesDeCaida} meses.`,
    ),
  ];

  if (peorTrimestrePromedioMensual != null) {
    escenarios.push(
      escenario(
        'Tu peor trimestre real',
        peorTrimestrePromedioMensual,
        'Se repite la peor racha de 3 meses que tuviste en las boletas que cargaste.',
      ),
    );
  }

  return {
    compromisoMensual,
    escenarios,
    sobreviveTodo: escenarios.every((e) => e.sobrevive),
  };
}

/** Checklist documental, marcando lo que ya tienes resuelto. */
function checklistIndependiente(perfil = {}) {
  return REQUISITOS_INDEPENDIENTE.map((r, idx) => ({
    ...r,
    cumplido: Array.isArray(perfil.cumplidos) ? perfil.cumplidos.includes(idx) : false,
  }));
}

/* ===== src/engine/inversion.js ===== */
/**
 * La propiedad como inversión: arriendo, rentabilidad y la comparación contra
 * simplemente arrendar e invertir la plata en otra cosa.
 *
 * Todo en UF, o sea en términos reales. Las tasas de plusvalía y de rendimiento
 * alternativo que entran aquí son reales (por sobre la inflación), no nominales.
 */




/**
 * Métricas de rentabilidad del primer año.
 *
 * @param {Object} p
 * @param {number} p.precioUF
 * @param {number} p.gastosCompraUF gastos operacionales de la compra
 * @param {number} [p.habilitacionUF] remodelación, muebles, lo que haga falta
 * @param {number} p.pieUF
 * @param {number} p.arriendoMensualUF
 * @param {number} [p.vacanciaAnual] fracción del año sin arrendar (0,083 = 1 mes)
 * @param {number} [p.gastosComunesMensualesUF] los paga el dueño solo si está vacío
 * @param {number} [p.contribucionesAnualesUF]
 * @param {number} [p.tasaAdministracion] fracción del arriendo que se lleva el corredor
 * @param {number} [p.tasaMantencion] provisión para reparaciones, fracción del arriendo
 * @param {number} [p.seguroAnualUF]
 * @param {number} p.servicioDeudaAnualUF suma de dividendos del año
 * @param {number} [p.impuestoArriendoAnualUF] 0 si es DFL2 y eres persona natural
 */
function metricasInversion({
  precioUF,
  gastosCompraUF = 0,
  habilitacionUF = 0,
  pieUF,
  arriendoMensualUF,
  vacanciaAnual = 1 / 12,
  gastosComunesMensualesUF = 0,
  contribucionesAnualesUF = 0,
  tasaAdministracion = 0,
  tasaMantencion = 0.05,
  seguroAnualUF = 0,
  servicioDeudaAnualUF,
  impuestoArriendoAnualUF = 0,
}) {
  const capitalInvertidoUF = pieUF + gastosCompraUF + habilitacionUF;
  const precioTotalUF = precioUF + gastosCompraUF + habilitacionUF;

  const arriendoBrutoAnualUF = arriendoMensualUF * 12;
  const ingresoEfectivoAnualUF = arriendoBrutoAnualUF * (1 - vacanciaAnual);

  // Los gastos comunes normalmente los paga el arrendatario; el dueño solo los
  // cubre los meses en que la propiedad está vacía.
  const gastosComunesVacanciaUF = gastosComunesMensualesUF * 12 * vacanciaAnual;
  const administracionUF = ingresoEfectivoAnualUF * tasaAdministracion;
  const mantencionUF = arriendoBrutoAnualUF * tasaMantencion;

  const gastosOperativosAnualUF =
    gastosComunesVacanciaUF + administracionUF + mantencionUF + contribucionesAnualesUF + seguroAnualUF;

  const noiUF = ingresoEfectivoAnualUF - gastosOperativosAnualUF;
  const flujoAntesDeImpuestoUF = noiUF - servicioDeudaAnualUF;
  const flujoNetoUF = flujoAntesDeImpuestoUF - impuestoArriendoAnualUF;

  return {
    capitalInvertidoUF,
    precioTotalUF,
    arriendoBrutoAnualUF,
    ingresoEfectivoAnualUF,
    gastosOperativosAnualUF,
    desgloseGastos: {
      gastosComunesVacanciaUF,
      administracionUF,
      mantencionUF,
      contribucionesAnualesUF,
      seguroAnualUF,
    },
    noiUF,
    servicioDeudaAnualUF,
    flujoAntesDeImpuestoUF,
    flujoNetoUF,
    flujoMensualUF: flujoNetoUF / 12,
    capRateBruto: precioTotalUF > 0 ? arriendoBrutoAnualUF / precioTotalUF : 0,
    capRateNeto: precioTotalUF > 0 ? noiUF / precioTotalUF : 0,
    cashOnCash: capitalInvertidoUF > 0 ? flujoNetoUF / capitalInvertidoUF : 0,
    // Cuántas veces el arriendo anual cabe en el precio: el "multiplicador" que
    // usan los corredores. Bajo 200 meses suele considerarse atractivo.
    mesesDeArriendoParaPagarla: arriendoMensualUF > 0 ? precioTotalUF / arriendoMensualUF : Infinity,
  };
}

/**
 * Proyección año a año con venta al final, para sacar TIR y VAN.
 *
 * @param {Object} p
 * @param {Array} p.filas tabla de amortización con dividendoUF y saldo
 * @param {number} p.aniosProyeccion
 * @param {number} p.plusvaliaAnualReal
 * @param {number} [p.crecimientoArriendoAnualReal]
 * @param {number} [p.tasaComisionVenta]
 * @param {number} [p.tasaDescuento] para el VAN
 * @param {Function} p.metricasDelAnio (anio, servicioDeudaAnualUF) => metricasInversion
 */
function proyectarInversion({
  filas,
  precioUF,
  capitalInvertidoUF,
  aniosProyeccion = 10,
  plusvaliaAnualReal = 0.02,
  crecimientoArriendoAnualReal = 0.01,
  tasaComisionVenta = 0.02,
  tasaDescuento = 0.05,
  exencionGananciaUsadaUF = 0,
  metricasDelAnio,
}) {
  const flujos = [-capitalInvertidoUF];
  const detalle = [];

  for (let anio = 1; anio <= aniosProyeccion; anio++) {
    const tramo = filas.slice((anio - 1) * 12, anio * 12);
    const servicioDeudaAnualUF = tramo.reduce((a, f) => a + (f.dividendoUF ?? f.cuota), 0);
    const factorArriendo = Math.pow(1 + crecimientoArriendoAnualReal, anio - 1);
    const m = metricasDelAnio(anio, servicioDeudaAnualUF, factorArriendo);

    let flujo = m.flujoNetoUF;
    const ultimoAnio = anio === aniosProyeccion;
    let venta = null;

    if (ultimoAnio) {
      const saldoInsolutoUF = tramo.length ? tramo[tramo.length - 1].saldo : 0;
      const precioVentaUF = precioUF * Math.pow(1 + plusvaliaAnualReal, anio);
      const comisionUF = precioVentaUF * tasaComisionVenta;
      const gananciaUF = precioVentaUF - precioUF;
      const impuesto = impuestoGananciaCapital({
        gananciaUF,
        exencionYaUsadaUF: exencionGananciaUsadaUF,
      });
      const netoVentaUF = precioVentaUF - comisionUF - saldoInsolutoUF - impuesto.impuestoUF;
      venta = {
        precioVentaUF, comisionUF, saldoInsolutoUF, gananciaUF,
        impuestoUF: impuesto.impuestoUF, netoVentaUF,
      };
      flujo += netoVentaUF;
    }

    flujos.push(flujo);
    detalle.push({
      anio,
      servicioDeudaAnualUF,
      noiUF: m.noiUF,
      flujoOperacionalUF: m.flujoNetoUF,
      flujoTotalUF: flujo,
      venta,
    });
  }

  const tirAnual = tir(flujos);
  return {
    flujos,
    detalle,
    tirAnual,
    vanUF: van(flujos, tasaDescuento),
    tasaDescuento,
    multiploSobreCapital: capitalInvertidoUF > 0
      ? flujos.slice(1).reduce((a, f) => a + f, 0) / capitalInvertidoUF
      : 0,
  };
}

/**
 * Los dos umbrales que definen si el negocio se sostiene.
 */
function puntosDeEquilibrio({ metricas, servicioDeudaAnualUF, vacanciaAnual, tasaAdministracion, tasaMantencion }) {
  // Arriendo mensual que deja el flujo en cero. El arriendo entra en el NOI
  // afectado por vacancia, administración y mantención, así que hay que
  // despejarlo del factor completo.
  const factor = (1 - vacanciaAnual) * (1 - tasaAdministracion) - tasaMantencion;
  const gastosFijos =
    metricas.desgloseGastos.contribucionesAnualesUF +
    metricas.desgloseGastos.seguroAnualUF +
    metricas.desgloseGastos.gastosComunesVacanciaUF;
  const arriendoAnualEquilibrio = factor > 0
    ? (servicioDeudaAnualUF + gastosFijos) / factor
    : Infinity;

  return {
    arriendoMensualEquilibrioUF: arriendoAnualEquilibrio / 12,
    holguraUF: metricas.arriendoBrutoAnualUF / 12 - arriendoAnualEquilibrio / 12,
    vacanciaMaximaTolerable: metricas.arriendoBrutoAnualUF > 0
      ? Math.max(0, 1 - (servicioDeudaAnualUF + gastosFijos) /
          (metricas.arriendoBrutoAnualUF * (1 - tasaAdministracion) - metricas.arriendoBrutoAnualUF * tasaMantencion))
      : 0,
  };
}

/**
 * Plusvalía real anual mínima para que la inversión rinda una TIR objetivo.
 * Se resuelve por bisección sobre la proyección completa.
 */
function plusvaliaMinimaParaTIR({ tirObjetivo, proyectar, min = -0.05, max = 0.15 }) {
  const f = (g) => {
    const r = proyectar(g);
    return r.tirAnual === null ? -1 : r.tirAnual - tirObjetivo;
  };
  let lo = min, hi = max;
  if (f(lo) > 0) return min;
  if (f(hi) < 0) return null;
  for (let k = 0; k < 80; k++) {
    const mid = (lo + hi) / 2;
    if (f(mid) < 0) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

/**
 * Comprar vs. arrendar.
 *
 * La comparación honesta no es "dividendo contra arriendo": es patrimonio
 * contra patrimonio. Si arriendas, el pie y los gastos de compra se quedan
 * invertidos, y la diferencia mensual entre el costo de ser propietario y el
 * arriendo también se invierte (o se consume, si el arriendo es más caro).
 *
 * Todo en UF, así que las tasas son reales.
 *
 * @param {Object} p
 * @param {Array} p.filas tabla de amortización con dividendoUF y saldo
 * @param {number} p.precioUF
 * @param {number} p.capitalInicialUF pie + gastos de compra
 * @param {number} p.arriendoEquivalenteMensualUF lo que pagarías por arrendar algo igual
 * @param {number} [p.costosPropietarioMensualesUF] contribuciones, gastos comunes, mantención
 * @param {number} [p.plusvaliaAnualReal]
 * @param {number} [p.rendimientoAlternativoAnualReal] lo que rinde tu plata invertida
 * @param {number} [p.crecimientoArriendoAnualReal]
 * @param {number} [p.aniosProyeccion]
 * @param {number} [p.tasaComisionVenta]
 */
function compararComprarVsArrendar({
  filas,
  precioUF,
  capitalInicialUF,
  arriendoEquivalenteMensualUF,
  costosPropietarioMensualesUF = 0,
  plusvaliaAnualReal = 0.02,
  rendimientoAlternativoAnualReal = 0.03,
  crecimientoArriendoAnualReal = 0.01,
  aniosProyeccion = 20,
  tasaComisionVenta = 0.02,
}) {
  const gPrecio = Math.pow(1 + plusvaliaAnualReal, 1 / 12) - 1;
  const rAlt = Math.pow(1 + rendimientoAlternativoAnualReal, 1 / 12) - 1;
  const gArriendo = Math.pow(1 + crecimientoArriendoAnualReal, 1 / 12) - 1;

  let valorPropiedad = precioUF;
  let portafolio = capitalInicialUF; // si arriendas, esta plata queda invertida
  let arriendo = arriendoEquivalenteMensualUF;

  const serie = [];
  let cruce = null;
  const meses = Math.min(aniosProyeccion * 12, filas.length);

  for (let mes = 1; mes <= meses; mes++) {
    const fila = filas[mes - 1];
    const dividendo = fila.dividendoUF ?? fila.cuota;
    const costoPropietario = dividendo + costosPropietarioMensualesUF;

    // El que arrienda invierte lo que se ahorra respecto de ser propietario.
    // Si arrendar sale más caro, la diferencia sale del portafolio.
    portafolio = portafolio * (1 + rAlt) + (costoPropietario - arriendo);
    valorPropiedad = valorPropiedad * (1 + gPrecio);
    arriendo = arriendo * (1 + gArriendo);

    const patrimonioComprar = valorPropiedad * (1 - tasaComisionVenta) - fila.saldo;
    const patrimonioArrendar = portafolio;

    if (cruce === null && patrimonioComprar > patrimonioArrendar) cruce = mes / 12;

    if (mes % 12 === 0) {
      serie.push({
        anio: mes / 12,
        patrimonioComprarUF: patrimonioComprar,
        patrimonioArrendarUF: patrimonioArrendar,
        diferenciaUF: patrimonioComprar - patrimonioArrendar,
        valorPropiedadUF: valorPropiedad,
        saldoDeudaUF: fila.saldo,
        arriendoMensualUF: arriendo,
      });
    }
  }

  const ultimo = serie[serie.length - 1] || null;
  return {
    serie,
    anioDeCruce: cruce,
    ganadorAlFinal: ultimo
      ? (ultimo.patrimonioComprarUF > ultimo.patrimonioArrendarUF ? 'comprar' : 'arrendar')
      : null,
    diferenciaFinalUF: ultimo ? ultimo.diferenciaUF : 0,
    supuestos: {
      plusvaliaAnualReal,
      rendimientoAlternativoAnualReal,
      crecimientoArriendoAnualReal,
      tasaComisionVenta,
    },
  };
}

/* ===== src/engine/escenarios.js ===== */
/**
 * Comparar alternativas: sensibilidad, prepagos, refinanciamiento y varias
 * propiedades u ofertas de banco lado a lado.
 *
 * Un solo número nunca alcanza para decidir. Lo que importa es cuánto se mueve
 * ese número cuando cambian los supuestos que no controlas.
 */




/**
 * Análisis de sensibilidad tipo tornado.
 *
 * Para cada variable se recalcula el escenario en su valor bajo y en su valor
 * alto, dejando el resto igual. El resultado se ordena por impacto, así queda a
 * la vista qué supuesto realmente mueve la aguja y cuál es ruido.
 *
 * @param {Object} entradaBase entrada de calcularCredito
 * @param {Array} variables [{clave, etiqueta, bajo, alto, formato}]
 * @param {Function} metrica (resultadoCredito) => number
 */
function analizarSensibilidad(entradaBase, variables, metrica) {
  const base = metrica(calcularCredito(entradaBase));

  const filas = variables.map((v) => {
    const evaluar = (valor) => {
      try {
        return metrica(calcularCredito({ ...entradaBase, [v.clave]: valor }));
      } catch {
        return null;
      }
    };
    const enBajo = evaluar(v.bajo);
    const enAlto = evaluar(v.alto);
    const deltas = [enBajo, enAlto].filter((x) => x !== null).map((x) => x - base);
    const impacto = deltas.length ? Math.max(...deltas.map(Math.abs)) : 0;

    return {
      clave: v.clave,
      etiqueta: v.etiqueta,
      formato: v.formato || 'numero',
      valorBajo: v.bajo,
      valorAlto: v.alto,
      enBajo,
      enAlto,
      deltaBajo: enBajo === null ? null : enBajo - base,
      deltaAlto: enAlto === null ? null : enAlto - base,
      impacto,
    };
  });

  filas.sort((a, b) => b.impacto - a.impacto);
  return { base, filas };
}

/** Variables por defecto del tornado, alrededor de una entrada dada. */
function variablesSensibilidadPorDefecto(e) {
  return [
    { clave: 'tasaAnual', etiqueta: 'Tasa de interés', bajo: Math.max(0.005, e.tasaAnual - 0.015), alto: e.tasaAnual + 0.015, formato: 'porcentaje' },
    { clave: 'plazoAnios', etiqueta: 'Plazo', bajo: 15, alto: 30, formato: 'anios' },
    { clave: 'piePorcentaje', etiqueta: 'Pie', bajo: 0.10, alto: 0.30, formato: 'porcentaje' },
    { clave: 'precioUF', etiqueta: 'Precio de la vivienda', bajo: e.precioUF * 0.9, alto: e.precioUF * 1.1, formato: 'uf' },
    { clave: 'tasaDesgravamenMensual', etiqueta: 'Seguro de desgravamen', bajo: 0.0002, alto: 0.00035, formato: 'porcentaje' },
    { clave: 'tasaIncendioSismoMensual', etiqueta: 'Seguro de incendio y sismo', bajo: 0.00015, alto: 0.0003, formato: 'porcentaje' },
  ];
}

/**
 * Simula abonos extraordinarios a capital.
 *
 * Dos modos:
 *   - 'plazo': la cuota queda igual y el crédito termina antes. Ahorra mucho
 *     más interés.
 *   - 'cuota': el plazo queda igual y baja el dividendo. Da aire mensual.
 *
 * Para un ingreso variable como el de un freelance, los meses buenos son la
 * munición: un abono anual bien puesto acorta años.
 */
function simularPrepago(entrada, { abonoMensualUF = 0, abonoAnualUF = 0, mesAbonoAnual = 12, modo = 'plazo' }) {
  const sin = calcularCredito(entrada);
  const con = calcularCredito({
    ...entrada,
    abonoMensualUF,
    abonoAnualUF,
    mesAbonoAnual,
    modoAbono: modo,
  });

  const mesesAhorrados = sin.plazoMeses - con.plazoMeses;
  const totalAbonadoUF = con.filas.reduce((a, f) => a + f.abonoExtra, 0);

  return {
    sin,
    con,
    modo,
    mesesAhorrados,
    aniosAhorrados: mesesAhorrados / 12,
    interesAhorradoUF: sin.totalInteresUF - con.totalInteresUF,
    totalAbonadoUF,
    // Por cada UF que abonas, cuántas UF de interés te ahorras.
    retornoPorUFAbonada: totalAbonadoUF > 0
      ? (sin.totalInteresUF - con.totalInteresUF) / totalAbonadoUF
      : 0,
    bajaDividendoUF: sin.dividendoPrimerMesUF - con.dividendoPrimerMesUF,
  };
}

/**
 * ¿Conviene refinanciar?
 *
 * Refinanciar no es gratis: pagas de nuevo tasación, estudio de títulos,
 * notaría, conservador y sobre todo el impuesto al mutuo sobre el saldo. La
 * pregunta correcta no es "¿la tasa nueva es más baja?" sino "¿en cuántos meses
 * recupero lo que me cuesta cambiarme?".
 *
 * @param {Object} p
 * @param {Object} p.creditoActual resultado de calcularCredito
 * @param {number} p.mesesPagados cuántos meses llevas pagando
 * @param {number} p.nuevaTasaAnual
 * @param {number} [p.nuevoPlazoAnios] por defecto, el plazo que te queda
 * @param {Object} p.gastos tarifas para el nuevo crédito
 * @param {number} p.precioUF
 */
function evaluarRefinanciamiento({
  creditoActual,
  mesesPagados,
  nuevaTasaAnual,
  nuevoPlazoAnios = null,
  gastos,
  precioUF,
  esDFL2 = false,
  convencionTasa = 'nominal',
  tasaDesgravamenMensual,
  tasaIncendioSismoMensual,
}) {
  const idx = Math.max(0, Math.min(mesesPagados - 1, creditoActual.filas.length - 1));
  const saldoUF = creditoActual.filas[idx].saldo;
  const mesesRestantes = creditoActual.plazoMeses - mesesPagados;

  if (saldoUF <= 0 || mesesRestantes <= 0) {
    return { viable: false, motivo: 'El crédito ya está pagado.' };
  }

  const nMeses = nuevoPlazoAnios ? Math.round(nuevoPlazoAnios * 12) : mesesRestantes;

  const gastosNuevo = calcularGastosOperacionales({
    precioUF,
    creditoBaseUF: saldoUF,
    gastos,
    esDFL2,
    financiarGastos: false,
  });
  // Al refinanciar no vuelves a pagar la compraventa, solo el mutuo nuevo.
  const costoRefinanciarUF =
    gastosNuevo.totalUF - gastos.gastosNotarialesCompraventaUF;

  const iNueva = tasaMensual(nuevaTasaAnual, convencionTasa);
  const cuotaNueva = cuotaFrancesa(saldoUF, iNueva, nMeses);
  const desgravamenNuevo = saldoUF * tasaDesgravamenMensual;
  const incendio = creditoActual.incendioMensualUF;
  const dividendoNuevoUF = cuotaNueva + desgravamenNuevo + incendio;

  const dividendoActualUF = creditoActual.filas[idx].dividendoUF;
  const ahorroMensualUF = dividendoActualUF - dividendoNuevoUF;

  const nuevaTabla = tablaAmortizacion({ capital: saldoUF, i: iNueva, n: nMeses });
  const interesRestanteActualUF = creditoActual.filas
    .slice(mesesPagados)
    .reduce((a, f) => a + f.interes, 0);

  const mesesParaRecuperar = ahorroMensualUF > 0
    ? costoRefinanciarUF / ahorroMensualUF
    : null;

  return {
    viable: true,
    saldoUF,
    mesesRestantes,
    nuevoPlazoMeses: nMeses,
    costoRefinanciarUF,
    detalleCosto: gastosNuevo.detalle,
    dividendoActualUF,
    dividendoNuevoUF,
    ahorroMensualUF,
    interesRestanteActualUF,
    interesNuevoUF: nuevaTabla.totalInteres,
    ahorroInteresTotalUF: interesRestanteActualUF - nuevaTabla.totalInteres,
    mesesParaRecuperar,
    conviene: ahorroMensualUF > 0 && mesesParaRecuperar !== null && mesesParaRecuperar < mesesRestantes,
    lectura: ahorroMensualUF <= 0
      ? 'Con esa tasa el dividendo no baja: refinanciar no tiene sentido.'
      : `Recuperas el costo de refinanciar en ${Math.ceil(mesesParaRecuperar)} meses (${cl(mesesParaRecuperar / 12, 1)} años). Te quedan ${mesesRestantes} meses de crédito.`,
  };
}

/**
 * Compara varios escenarios y marca cuál gana en cada métrica.
 *
 * @param {Array} escenarios [{id, nombre, resultado, metricas}]
 * @param {Array} definiciones [{clave, etiqueta, mejor: 'menor'|'mayor', formato}]
 */
function compararEscenarios(escenarios, definiciones) {
  const filas = definiciones.map((d) => {
    const valores = escenarios.map((e) => {
      const v = d.obtener(e);
      return { id: e.id, valor: v };
    });
    const validos = valores.filter((v) => typeof v.valor === 'number' && Number.isFinite(v.valor));
    let ganadorId = null;
    if (validos.length > 0) {
      const mejor = d.mejor === 'mayor'
        ? validos.reduce((a, b) => (b.valor > a.valor ? b : a))
        : validos.reduce((a, b) => (b.valor < a.valor ? b : a));
      ganadorId = mejor.id;
    }
    return { clave: d.clave, etiqueta: d.etiqueta, formato: d.formato, mejor: d.mejor, valores, ganadorId };
  });

  // Cuántas métricas gana cada escenario.
  const puntajes = {};
  for (const e of escenarios) puntajes[e.id] = 0;
  for (const f of filas) if (f.ganadorId) puntajes[f.ganadorId] += 1;

  const ranking = Object.entries(puntajes)
    .map(([id, puntos]) => ({ id, puntos, nombre: escenarios.find((e) => e.id === id)?.nombre }))
    .sort((a, b) => b.puntos - a.puntos);

  return { filas, puntajes, ranking };
}

/* ===== src/engine/veredicto.js ===== */
/**
 * El veredicto: traduce todos los números a un puñado de señales legibles.
 *
 * No decide por ti, y a propósito no entrega un "puntaje total" único: sumar
 * peras con manzanas para producir un 7,4 sobre 10 esconde justo lo que
 * necesitas ver. Lo que hace es marcar cada dimensión en verde, ámbar o rojo y
 * decir por qué.
 */




/** @typedef {'verde'|'ambar'|'rojo'|'sin-dato'} Semaforo */

const señal = (semaforo, titulo, valor, mensaje, detalle = null) =>
  ({ semaforo, titulo, valor, mensaje, detalle });

/**
 * Construye el tablero de señales.
 *
 * @param {Object} p
 * @param {Object} p.credito resultado de calcularCredito
 * @param {Object} [p.inversion] métricas de metricasInversion
 * @param {Object} [p.proyeccion] resultado de proyectarInversion
 * @param {Object} p.perfilIngresos { modalidad, rentaAcreditableMensual, ingresoRealMensual, otrasDeudasMensuales, coefVariacion, peorTrimestrePromedioMensual, ahorroLiquido }
 * @param {number} p.valorUF
 * @param {number} [p.rendimientoAlternativoAnual] tu tasa de comparación
 */
function construirVeredicto({
  credito,
  inversion = null,
  proyeccion = null,
  perfilIngresos,
  valorUF,
  rendimientoAlternativoAnual = 0.04,
}) {
  const señales = [];
  const dividendoCLP = credito.dividendoPrimerMesUF * valorUF;

  // 1. Carga financiera.
  const carga = cargaFinanciera({
    dividendoMensual: dividendoCLP,
    otrasDeudasMensuales: perfilIngresos.otrasDeudasMensuales || 0,
    rentaAcreditableMensual: perfilIngresos.rentaAcreditableMensual,
  });
  señales.push(
    carga.valor === null
      ? señal('sin-dato', 'Carga financiera', null, 'Falta cargar tus ingresos.')
      : señal(
          carga.semaforo,
          'Carga financiera',
          carga.valor,
          carga.mensaje,
          `El dividendo más tus otras deudas se llevan el ${cl(carga.valor * 100, 1)}% de la renta que el banco te reconoce.`,
        ),
  );

  // 2. Colchón de liquidez. Para un ingreso variable esto pesa más que la tasa.
  const mesesRecomendados = colchonRecomendado({
    modalidad: perfilIngresos.modalidad,
    coefVariacion: perfilIngresos.coefVariacion || 0,
  });
  const compromisoMensualCLP = dividendoCLP + (perfilIngresos.otrasDeudasMensuales || 0);
  const mesesQueTienes = compromisoMensualCLP > 0
    ? (perfilIngresos.ahorroLiquidoCLP || 0) / compromisoMensualCLP
    : 0;
  señales.push(
    señal(
      mesesQueTienes >= mesesRecomendados ? 'verde' : mesesQueTienes >= mesesRecomendados / 2 ? 'ambar' : 'rojo',
      'Colchón de liquidez',
      mesesQueTienes,
      `Tienes ${cl(mesesQueTienes, 1)} meses de dividendo guardados y para tu perfil convienen ${mesesRecomendados}.`,
      perfilIngresos.modalidad === 'dependiente'
        ? 'Con sueldo fijo, 6 meses es un piso razonable.'
        : 'Con ingresos variables el colchón no es un lujo: es lo que te separa de vender apurado.',
    ),
  );

  // 3. Prueba de estrés.
  if (perfilIngresos.ingresoRealMensual) {
    const estres = pruebaDeEstres({
      dividendoMensual: dividendoCLP,
      otrasDeudasMensuales: perfilIngresos.otrasDeudasMensuales || 0,
      rentaAcreditableMensual: perfilIngresos.rentaAcreditableMensual,
      ingresoRealMensual: perfilIngresos.ingresoRealMensual,
      caidaPorcentual: 0.30,
      mesesDeCaida: 6,
      ahorroLiquidoUF: perfilIngresos.ahorroLiquidoCLP || 0,
      peorTrimestrePromedioMensual: perfilIngresos.peorTrimestrePromedioMensual,
    });
    const fallan = estres.escenarios.filter((e) => !e.sobrevive);
    señales.push(
      señal(
        estres.sobreviveTodo ? 'verde' : fallan.length === estres.escenarios.length ? 'rojo' : 'ambar',
        'Prueba de estrés',
        estres.sobreviveTodo ? 1 : 0,
        estres.sobreviveTodo
          ? 'Aguantas los escenarios malos con el ahorro que tienes.'
          : `No aguantas: ${fallan.map((e) => e.nombre.toLowerCase()).join(' ni ')}.`,
        fallan.length
          ? fallan.map((e) => `${e.nombre}: te faltarían ${Math.round(e.deficitMensual).toLocaleString('es-CL')} al mes.`).join(' ')
          : null,
      ),
    );
  }

  // 4. CAE contra la tasa nominal: cuánto te cuesta de verdad el crédito.
  if (credito.caeAnual != null) {
    const brecha = credito.caeAnual - credito.tasaMensualAplicada * 12;
    // Los seguros y gastos de un crédito hipotecario chileno normal agregan del
    // orden de 1 punto porcentual sobre la tasa, y esa brecha se mantiene casi
    // constante a cualquier nivel de tasa. Los umbrales están puestos ahí: solo
    // se enciende la alarma cuando los seguros o los gastos se salen de lo
    // habitual, no por el hecho de que exista brecha.
    señales.push(
      señal(
        brecha < 0.012 ? 'verde' : brecha < 0.018 ? 'ambar' : 'rojo',
        'Costo real del crédito (CAE)',
        credito.caeAnual,
        `La CAE es ${cl(credito.caeAnual * 100, 2)}%, o sea ${cl(brecha * 100, 2)} puntos sobre la tasa que te ofrecieron.`,
        'La diferencia son los seguros y los gastos operacionales. Es la cifra que sirve para comparar bancos.',
      ),
    );
  }

  // 5. Cuánto pagas en total respecto del precio.
  const multiplo = credito.costoTotalUF / (credito.pieUF + credito.montoCreditoUF);
  señales.push(
    señal(
      multiplo < 1.5 ? 'verde' : multiplo < 1.9 ? 'ambar' : 'rojo',
      'Costo total',
      multiplo,
      `Vas a desembolsar ${cl(multiplo, 2)} veces el valor de la propiedad.`,
      'Incluye pie, gastos, intereses y seguros a lo largo de todo el crédito.',
    ),
  );

  // Señales de inversión, solo si evaluaste el escenario de arriendo.
  if (inversion) {
    señales.push(
      señal(
        inversion.flujoMensualUF > 0 ? 'verde' : inversion.flujoMensualUF > -2 ? 'ambar' : 'rojo',
        'Flujo de caja del arriendo',
        inversion.flujoMensualUF,
        inversion.flujoMensualUF > 0
          ? `El arriendo cubre el dividendo y te sobran ${cl(inversion.flujoMensualUF, 2)} UF al mes.`
          : `El arriendo no alcanza: tienes que poner ${cl(Math.abs(inversion.flujoMensualUF), 2)} UF de tu bolsillo cada mes.`,
        'Un flujo negativo no es fatal si la plusvalía compensa, pero es plata que sale todos los meses.',
      ),
    );
    señales.push(
      señal(
        inversion.capRateNeto > 0.045 ? 'verde' : inversion.capRateNeto > 0.03 ? 'ambar' : 'rojo',
        'Rentabilidad neta (cap rate)',
        inversion.capRateNeto,
        `${cl(inversion.capRateNeto * 100, 2)}% neto sobre la inversión total.`,
        'Descontadas vacancia, administración, mantención y contribuciones. Sin considerar la deuda.',
      ),
    );
  }

  if (proyeccion && proyeccion.tirAnual != null) {
    señales.push(
      señal(
        proyeccion.tirAnual > rendimientoAlternativoAnual ? 'verde'
          : proyeccion.tirAnual > rendimientoAlternativoAnual - 0.02 ? 'ambar' : 'rojo',
        'TIR proyectada',
        proyeccion.tirAnual,
        `${cl(proyeccion.tirAnual * 100, 2)}% real anual contra tu alternativa de ${cl(rendimientoAlternativoAnual * 100, 1)}%.`,
        'Incluye la venta al final del período. Es muy sensible al supuesto de plusvalía: míralo junto al análisis de sensibilidad.',
      ),
    );
  }

  const conteo = { verde: 0, ambar: 0, rojo: 0, 'sin-dato': 0 };
  for (const s of señales) conteo[s.semaforo] += 1;

  return {
    señales,
    conteo,
    bloqueantes: señales.filter((s) => s.semaforo === 'rojo'),
    resumen: resumir(conteo, señales),
  };
}

function resumir(conteo, señales) {
  const rojas = señales.filter((s) => s.semaforo === 'rojo');
  if (rojas.length === 0 && conteo.ambar === 0) {
    return 'Todas las señales están en verde. Con los supuestos que cargaste, la operación se sostiene.';
  }
  if (rojas.length === 0) {
    return 'Sin señales rojas, pero hay puntos en ámbar que conviene apretar antes de firmar.';
  }
  if (rojas.length === 1) {
    return `Hay una señal roja: ${rojas[0].titulo.toLowerCase()}. Resuélvela antes de avanzar.`;
  }
  return `Hay ${rojas.length} señales rojas (${rojas.map((s) => s.titulo.toLowerCase()).join(', ')}). Con estos supuestos, la operación es frágil.`;
}

/**
 * Calcula absolutamente todo a partir de una entrada.
 * @param {ReturnType<entradaPorDefecto>} e
 */
function evaluarOperacion(e) {
  const { propiedad: pr, credito: cr, gastos, perfil, arriendo, mercado } = e;
  const avisos = [];

  // --- Programas: definen el pie mínimo y la tasa efectiva --------------
  const prog = evaluarProgramas({
    precioUF: pr.precioUF,
    tasaAnual: cr.tasaAnual,
    esViviendaNueva: pr.esNueva,
    ...e.programas,
  });

  const pieMinimo = 1 - prog.ltvMaximo;
  if (cr.piePorcentaje < pieMinimo - 1e-9) {
    avisos.push({
      nivel: 'error',
      texto: prog.fogaes.elegible
        ? `Con un pie de ${cl(cr.piePorcentaje * 100, 0)}% ningún banco te financia: el mínimo con FOGAES es ${cl(pieMinimo * 100, 0)}%.`
        : `Un pie de ${cl(cr.piePorcentaje * 100, 0)}% requiere FOGAES, y con este perfil no calificas. El mínimo sin FOGAES es 20%.`,
    });
  }

  const dfl2 = evaluarDFL2({
    superficieUtilM2: pr.superficieUtilM2,
    viviendasDFL2QueYaTiene: pr.viviendasDFL2QueYaTiene || 0,
  });
  const esDFL2 = pr.esDFL2 && dfl2.califica;
  if (pr.esDFL2 && !dfl2.califica) {
    avisos.push({ nivel: 'aviso', texto: `Marcaste DFL2 pero no califica: ${dfl2.motivos.join(' ')}` });
  }

  // --- Crédito -----------------------------------------------------------
  const entradaCredito = {
    precioUF: pr.precioUF,
    piePorcentaje: cr.piePorcentaje,
    pieUF: null,
    tasaAnual: prog.tasaEfectiva,
    plazoAnios: cr.plazoAnios,
    convencionTasa: cr.convencionTasa,
    tasaDesgravamenMensual: cr.tasaDesgravamenMensual,
    tasaIncendioSismoMensual: cr.tasaIncendioSismoMensual,
    comisionAdminMensualUF: cr.comisionAdminMensualUF,
    valorTasacionUF: pr.valorTasacionUF || pr.precioUF,
    esDFL2,
    esViviendaSocial: pr.esViviendaSocial,
    financiarGastos: cr.financiarGastos,
    abonoMensualUF: cr.abonoMensualUF,
    abonoAnualUF: cr.abonoAnualUF,
    mesAbonoAnual: cr.mesAbonoAnual,
    modoAbono: cr.modoAbono,
    gastos,
  };
  const credito = calcularCredito(entradaCredito);
  if (credito.gastosOperacionales.alerta) {
    avisos.push({ nivel: 'aviso', texto: credito.gastosOperacionales.alerta });
  }

  // --- Ingresos y capacidad de pago --------------------------------------
  const estadisticaBoletas = analizarBoletas(perfil.boletas);
  const promedioBoletas = estadisticaBoletas
    ? estadisticaBoletas.promedio
    : perfil.promedioBoletasMensual;

  const renta = rentaAcreditable({
    modalidad: perfil.modalidad,
    sueldoLiquidoMensual: perfil.sueldoLiquidoMensual,
    promedioBoletasMensual: promedioBoletas,
    rentaLiquidaF22Anual: perfil.rentaLiquidaF22Anual,
    factorCastigo: perfil.factorCastigo,
  });

  const capacidad = capacidadDePago({
    rentaAcreditableMensual: renta.total,
    otrasDeudasMensuales: perfil.otrasDeudasMensuales,
    cargaMaxima: perfil.cargaMaxima,
  });

  const dividendoCLP = credito.dividendoPrimerMesUF * mercado.valorUF;
  const carga = cargaFinanciera({
    dividendoMensual: dividendoCLP,
    otrasDeudasMensuales: perfil.otrasDeudasMensuales,
    rentaAcreditableMensual: renta.total,
  });

  const alcance = capacidadDeCompra({
    dividendoMaximoUF: capacidad.dividendoMaximo / mercado.valorUF,
    tasaAnual: prog.tasaEfectiva,
    plazoAnios: cr.plazoAnios,
    piePorcentaje: cr.piePorcentaje,
    tasaDesgravamenMensual: cr.tasaDesgravamenMensual,
    tasaIncendioSismoMensual: cr.tasaIncendioSismoMensual,
    comisionAdminMensualUF: cr.comisionAdminMensualUF,
    convencionTasa: cr.convencionTasa,
  });

  const esIndependiente = perfil.modalidad === 'honorarios' || perfil.modalidad === 'mixto';
  const retencion = esIndependiente
    ? proyectarRetencion({ brutoMensual: promedioBoletas, desdeAnio: 2026, hastaAnio: 2028 })
    : null;

  // --- Tributario ---------------------------------------------------------
  const brutoAnual = esIndependiente
    ? promedioBoletas * 12 + perfil.sueldoLiquidoMensual * 12
    : perfil.sueldoLiquidoMensual * 12;
  const imponible = esIndependiente
    ? rentaImponibleHonorarios({ brutoAnualCLP: brutoAnual, valorUTM: mercado.valorUTM })
    : { rentaImponible: brutoAnual, gastosPresuntos: 0, cotizaciones: 0 };

  const beneficio55 = beneficio55bisPorAnio(credito.filas, {
    rentaBrutaImponibleAnualCLP: imponible.rentaImponible,
    valorUTM: mercado.valorUTM,
    valorUF: mercado.valorUF,
    anios: Math.min(10, Math.ceil(credito.plazoMeses / 12)),
  });

  const contrib = contribuciones({
    avaluoFiscalCLP: pr.avaluoFiscalCLP,
    tasaAnual: mercado.tasaContribucionesAnual,
    esDFL2,
  });

  // --- Escenario arriendo -------------------------------------------------
  let inversion = null;
  let proyeccion = null;
  let equilibrio = null;
  let versusArrendar = null;

  if (arriendo.activo) {
    const servicioDeudaAnio1 = credito.filas.slice(0, 12).reduce((a, f) => a + f.dividendoUF, 0);
    // Si es DFL2 y eres persona natural, el arriendo no constituye renta.
    const arriendoTributable = !dfl2.arriendoExentoDeRenta;

    const construirMetricas = (arriendoMensualUF, servicioDeudaAnualUF) => metricasInversion({
      precioUF: pr.precioUF,
      gastosCompraUF: credito.gastosOperacionales.totalUF,
      habilitacionUF: pr.habilitacionUF,
      pieUF: credito.pieUF,
      arriendoMensualUF,
      vacanciaAnual: arriendo.vacanciaAnual,
      gastosComunesMensualesUF: pr.gastosComunesMensualesUF,
      contribucionesAnualesUF: contrib.anualCLP / mercado.valorUF,
      tasaAdministracion: arriendo.tasaAdministracion,
      tasaMantencion: arriendo.tasaMantencion,
      seguroAnualUF: arriendo.seguroAnualUF,
      servicioDeudaAnualUF,
      impuestoArriendoAnualUF: 0,
    });

    inversion = construirMetricas(arriendo.arriendoMensualUF, servicioDeudaAnio1);
    inversion.arriendoTributable = arriendoTributable;
    inversion.exentoPorDFL2 = dfl2.arriendoExentoDeRenta;

    equilibrio = puntosDeEquilibrio({
      metricas: inversion,
      servicioDeudaAnualUF: servicioDeudaAnio1,
      vacanciaAnual: arriendo.vacanciaAnual,
      tasaAdministracion: arriendo.tasaAdministracion,
      tasaMantencion: arriendo.tasaMantencion,
    });

    const proyectarCon = (plusvalia) => proyectarInversion({
      filas: credito.filas,
      precioUF: pr.precioUF,
      capitalInvertidoUF: inversion.capitalInvertidoUF,
      aniosProyeccion: mercado.aniosProyeccion,
      plusvaliaAnualReal: plusvalia,
      crecimientoArriendoAnualReal: mercado.crecimientoArriendoAnualReal,
      tasaComisionVenta: mercado.tasaComisionVenta,
      tasaDescuento: mercado.rendimientoAlternativoAnualReal,
      metricasDelAnio: (anio, servicioDeudaAnualUF, factorArriendo) =>
        construirMetricas(arriendo.arriendoMensualUF * factorArriendo, servicioDeudaAnualUF),
    });
    proyeccion = proyectarCon(mercado.plusvaliaAnualReal);
    proyeccion.proyectarCon = proyectarCon;

    versusArrendar = compararComprarVsArrendar({
      filas: credito.filas,
      precioUF: pr.precioUF,
      capitalInicialUF: credito.pieUF + credito.gastosOperacionales.totalUF + pr.habilitacionUF,
      arriendoEquivalenteMensualUF: arriendo.arriendoEquivalenteMensualUF,
      costosPropietarioMensualesUF:
        pr.gastosComunesMensualesUF + contrib.mensualCLP / mercado.valorUF,
      plusvaliaAnualReal: mercado.plusvaliaAnualReal,
      rendimientoAlternativoAnualReal: mercado.rendimientoAlternativoAnualReal,
      crecimientoArriendoAnualReal: mercado.crecimientoArriendoAnualReal,
      aniosProyeccion: Math.min(mercado.aniosProyeccion * 2, cr.plazoAnios),
      tasaComisionVenta: mercado.tasaComisionVenta,
    });
  }

  // --- Comparaciones de programas ----------------------------------------
  const fogaesComparado = compararFogaes(entradaCredito, {
    ahorroActualUF: mercado.ahorroActualUF,
    ahorroMensualUF: mercado.ahorroMensualUF,
    plusvaliaAnualReal: mercado.plusvaliaAnualReal,
  });
  const subsidioComparado = compararSubsidioDividendo({ ...entradaCredito, tasaAnual: cr.tasaAnual });

  // --- Sensibilidad y prepago --------------------------------------------
  const sensibilidad = analizarSensibilidad(
    entradaCredito,
    variablesSensibilidadPorDefecto(entradaCredito),
    (c) => c.dividendoPrimerMesUF,
  );

  const prepago = (cr.abonoMensualUF > 0 || cr.abonoAnualUF > 0)
    ? simularPrepago(
        { ...entradaCredito, abonoMensualUF: 0, abonoAnualUF: 0 },
        { abonoMensualUF: cr.abonoMensualUF, abonoAnualUF: cr.abonoAnualUF, mesAbonoAnual: cr.mesAbonoAnual, modo: cr.modoAbono },
      )
    : null;

  // --- Veredicto ----------------------------------------------------------
  const veredicto = construirVeredicto({
    credito,
    inversion,
    proyeccion,
    valorUF: mercado.valorUF,
    rendimientoAlternativoAnual: mercado.rendimientoAlternativoAnualReal,
    perfilIngresos: {
      modalidad: perfil.modalidad,
      rentaAcreditableMensual: renta.total,
      ingresoRealMensual: esIndependiente
        ? liquidoHonorarios({ brutoMensual: promedioBoletas, anio: 2026 }).liquidoRecibido + perfil.sueldoLiquidoMensual
        : perfil.sueldoLiquidoMensual,
      otrasDeudasMensuales: perfil.otrasDeudasMensuales,
      coefVariacion: estadisticaBoletas ? estadisticaBoletas.coefVariacion : 0,
      peorTrimestrePromedioMensual: estadisticaBoletas
        ? estadisticaBoletas.peorTrimestrePromedioMensual
        : null,
      ahorroLiquidoCLP: perfil.ahorroLiquidoCLP,
    },
  });

  return {
    entrada: e,
    avisos,
    credito,
    programas: prog,
    fogaesComparado,
    subsidioComparado,
    dfl2,
    ingresos: {
      estadisticaBoletas,
      promedioBoletas,
      renta,
      capacidad,
      carga,
      alcance,
      retencion,
      colchonRecomendadoMeses: colchonRecomendado({
        modalidad: perfil.modalidad,
        coefVariacion: estadisticaBoletas ? estadisticaBoletas.coefVariacion : 0,
      }),
    },
    impuestos: { imponible, beneficio55, contribuciones: contrib },
    inversion,
    equilibrio,
    proyeccion,
    versusArrendar,
    sensibilidad,
    prepago,
    veredicto,
  };
}

/** Formato chileno: puntos de miles, coma decimal, UF con dos decimales. */

const nfCLP = new Intl.NumberFormat('es-CL', { maximumFractionDigits: 0 });
const nfUF = new Intl.NumberFormat('es-CL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nfUF0 = new Intl.NumberFormat('es-CL', { maximumFractionDigits: 0 });

function clp(x) {
  if (x == null || !Number.isFinite(x)) return '—';
  return '$' + nfCLP.format(Math.round(x));
}

function uf(x, decimales = 2) {
  if (x == null || !Number.isFinite(x)) return '—';
  return (decimales === 0 ? nfUF0 : nfUF).format(x) + ' UF';
}

function ufCorto(x, decimales = 2) {
  if (x == null || !Number.isFinite(x)) return '—';
  return (decimales === 0 ? nfUF0 : nfUF).format(x);
}

function pct(x, decimales = 2) {
  if (x == null || !Number.isFinite(x)) return '—';
  return (x * 100).toLocaleString('es-CL', {
    minimumFractionDigits: decimales, maximumFractionDigits: decimales,
  }) + '%';
}

function numero(x, decimales = 1) {
  if (x == null || !Number.isFinite(x)) return '—';
  return x.toLocaleString('es-CL', { minimumFractionDigits: decimales, maximumFractionDigits: decimales });
}

function anios(meses) {
  if (meses == null || !Number.isFinite(meses)) return '—';
  const a = Math.floor(meses / 12);
  const m = Math.round(meses % 12);
  if (a === 0) return `${m} ${m === 1 ? 'mes' : 'meses'}`;
  if (m === 0) return `${a} ${a === 1 ? 'año' : 'años'}`;
  return `${a} ${a === 1 ? 'año' : 'años'} y ${m} ${m === 1 ? 'mes' : 'meses'}`;
}

/** Convierte lo que el usuario escribe en un número, tolerando formato chileno. */
function aNumero(texto) {
  if (typeof texto === 'number') return texto;
  if (!texto) return 0;
  const limpio = String(texto)
    .replace(/[^\d,.-]/g, '')
    .replace(/\./g, '')
    .replace(',', '.');
  const n = Number.parseFloat(limpio);
  return Number.isFinite(n) ? n : 0;
}

/** Escapa texto para insertarlo en HTML sin riesgo. */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/**
 * Estado de la aplicación y persistencia.
 *
 * Guarda en localStorage para que no pierdas lo que cargaste al cerrar la

 */



const CLAVE = 'calculadora-hipotecaria-cl/v1';

function nuevoEscenario(nombre, entrada) {
  return { id: 'e' + Math.random().toString(36).slice(2, 9), nombre, entrada };
}

function estadoInicial() {
  const base = entradaPorDefecto();
  return {
    escenarios: [nuevoEscenario(base.propiedad.nombre, base)],
    activoId: null, // se resuelve al primero
    pestana: 'datos',
  };
}

function cargar() {
  const inicial = estadoInicial();
  inicial.activoId = inicial.escenarios[0].id;
  try {
    const crudo = localStorage.getItem(CLAVE);
    if (!crudo) return inicial;
    const guardado = JSON.parse(crudo);
    if (!guardado?.escenarios?.length) return inicial;
    // Rellena claves nuevas que no existían cuando se guardó.
    guardado.escenarios = guardado.escenarios.map((e) => ({
      ...e,
      entrada: fusionar(entradaPorDefecto(), e.entrada),
    }));
    if (!guardado.escenarios.some((e) => e.id === guardado.activoId)) {
      guardado.activoId = guardado.escenarios[0].id;
    }
    return guardado;
  } catch {
    return inicial;
  }
}

function guardar(estado) {
  try {
    localStorage.setItem(CLAVE, JSON.stringify({
      escenarios: estado.escenarios,
      activoId: estado.activoId,
      pestana: estado.pestana,
    }));
  } catch {
    // Ventana privada o almacenamiento bloqueado: la app funciona igual,
    // simplemente no recuerda entre sesiones.
  }
}

function limpiar() {
  try { localStorage.removeItem(CLAVE); } catch { /* ver comentario en guardar */ }
}

/** Mezcla profunda: la base aporta las claves, el guardado aporta los valores. */
function fusionar(base, guardado) {
  if (!guardado || typeof guardado !== 'object') return base;
  const out = Array.isArray(base) ? [...base] : { ...base };
  for (const [k, v] of Object.entries(guardado)) {
    if (v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object') {
      out[k] = fusionar(base[k], v);
    } else if (v !== undefined) {
      out[k] = v;
    }
  }
  return out;
}

function escenarioActivo(estado) {
  return estado.escenarios.find((e) => e.id === estado.activoId) || estado.escenarios[0];
}

function leerRuta(objeto, ruta) {
  return ruta.split('.').reduce((o, k) => (o == null ? undefined : o[k]), objeto);
}

function escribirRuta(objeto, ruta, valor) {
  const partes = ruta.split('.');
  const ultima = partes.pop();
  const destino = partes.reduce((o, k) => (o[k] ??= {}), objeto);
  destino[ultima] = valor;
}

function duplicarEscenario(estado, id) {
  const original = estado.escenarios.find((e) => e.id === id);
  if (!original) return estado;
  const copia = nuevoEscenario(
    `${original.entrada.propiedad.nombre} (copia)`,
    JSON.parse(JSON.stringify(original.entrada)),
  );
  copia.entrada.propiedad.nombre = copia.nombre;
  estado.escenarios.push(copia);
  estado.activoId = copia.id;
  return estado;
}

function agregarEscenario(estado) {
  const n = estado.escenarios.length + 1;
  const entrada = entradaPorDefecto();
  entrada.propiedad.nombre = `Departamento ${n}`;
  const nuevo = nuevoEscenario(entrada.propiedad.nombre, entrada);
  estado.escenarios.push(nuevo);
  estado.activoId = nuevo.id;
  return estado;
}

function eliminarEscenario(estado, id) {
  if (estado.escenarios.length <= 1) return estado;
  estado.escenarios = estado.escenarios.filter((e) => e.id !== id);
  if (estado.activoId === id) estado.activoId = estado.escenarios[0].id;
  return estado;
}
