/* ==========================================================================
   Sistema visual

   Neutros sesgados al petróleo (no gris puro), acento teal profundo, y una
   paleta de estado separada del acento. Las series de gráfico están validadas
   para daltonismo en ambos temas: no son un volteo automático del tema claro,
   son pasos elegidos y comprobados contra cada fondo.
   ========================================================================== */

:root {
  /* Superficies y tinta */
  --fondo: #f2f5f4;
  --superficie: #ffffff;
  --superficie-2: #f7f9f9;
  --borde: #dde5e4;
  --borde-fuerte: #c3d0ce;
  --tinta: #0e1a19;
  --tinta-2: #3c4d4b;
  --tinta-3: #647674;

  /* Acento */
  --acento: #00695e;
  --acento-fuerte: #004d45;
  --acento-suave: #dceeeb;
  --acento-borde: #a6d5ce;

  /* Estado: reservado, nunca se usa como color de serie */
  --bien: #1f6b45;
  --bien-fondo: #e2f2e9;
  --alerta: #8a5a00;
  --alerta-fondo: #fbeed7;
  --grave: #a8322c;
  --grave-fondo: #fbe6e4;
  --neutro-estado: #5a6a69;
  --neutro-estado-fondo: #eaefee;

  /* Series de gráfico */
  --serie-1: #00897b;
  --serie-2: #c97b12;
  --serie-3: #8149c9;
  --serie-1-tenue: #00897b26;
  --serie-2-tenue: #c97b1226;
  --rejilla: #e6ecea;

  /* Tipografía */
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --texto: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --dato: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* Ritmo */
  --r1: 4px;  --r2: 8px;  --r3: 12px; --r4: 16px;
  --r5: 24px; --r6: 32px; --r7: 48px;
  --radio: 10px;
  --radio-s: 6px;
  --sombra: 0 1px 2px #0e1a190a, 0 4px 14px #0e1a190f;
  --ancho: 1180px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #0b1110;
    --superficie: #141d1c;
    --superficie-2: #192423;
    --borde: #263433;
    --borde-fuerte: #384a48;
    --tinta: #e4edeb;
    --tinta-2: #b3c3c1;
    --tinta-3: #819593;
    --tinta-3: #859997;

    --acento: #4fc2b2;
    --acento-fuerte: #7ad6c8;
    --acento-suave: #10312d;
    --acento-borde: #235c54;

    --bien: #5dbe85;
    --bien-fondo: #12291d;
    --alerta: #dca23a;
    --alerta-fondo: #2e2410;
    --grave: #f0817a;
    --grave-fondo: #33191a;
    --neutro-estado: #8fa3a1;
    --neutro-estado-fondo: #1d2827;

    --serie-1: #31a697;
    --serie-2: #b9801f;
    --serie-3: #9575d8;
    --serie-1-tenue: #31a69733;
    --serie-2-tenue: #b9801f33;
    --rejilla: #24312f;

    --sombra: 0 1px 2px #0000004d, 0 4px 14px #00000040;
  }
}

:root[data-theme="dark"] {
  --fondo: #0b1110;
  --superficie: #141d1c;
  --superficie-2: #192423;
  --borde: #263433;
  --borde-fuerte: #384a48;
  --tinta: #e4edeb;
  --tinta-2: #b3c3c1;
  --tinta-3: #859997;

  --acento: #4fc2b2;
  --acento-fuerte: #7ad6c8;
  --acento-suave: #10312d;
  --acento-borde: #235c54;

  --bien: #5dbe85;
  --bien-fondo: #12291d;
  --alerta: #dca23a;
  --alerta-fondo: #2e2410;
  --grave: #f0817a;
  --grave-fondo: #33191a;
  --neutro-estado: #8fa3a1;
  --neutro-estado-fondo: #1d2827;

  --serie-1: #31a697;
  --serie-2: #b9801f;
  --serie-3: #9575d8;
  --serie-1-tenue: #31a69733;
  --serie-2-tenue: #b9801f33;
  --rejilla: #24312f;

  --sombra: 0 1px 2px #0000004d, 0 4px 14px #00000040;
}

/* --- Base ---------------------------------------------------------------- */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--fondo);
  color: var(--tinta);
  font-family: var(--texto);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: var(--display);
  font-weight: 650;
  letter-spacing: -0.015em;
  text-wrap: balance;
  margin: 0;
}
h1 { font-size: 1.35rem; }
h2 { font-size: 1.1rem; }
h3 { font-size: 0.95rem; }

p { margin: 0 0 var(--r3); max-width: 68ch; }
a { color: var(--acento); text-decoration-thickness: 1px; text-underline-offset: 2px; }

:focus-visible {
  outline: 2px solid var(--acento);
  outline-offset: 2px;
  border-radius: var(--radio-s);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

.num { font-family: var(--dato); font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

.etiqueta {
  font-family: var(--texto);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--tinta-3);
}

.oculto { display: none !important; }

/* --- Cabecera ------------------------------------------------------------ */

.cabecera {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--superficie) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--borde);
}
.cabecera-fila {
  max-width: var(--ancho); margin: 0 auto;
  padding: var(--r3) var(--r4);
  display: flex; align-items: center; gap: var(--r4); flex-wrap: wrap;
}
.marca { display: flex; align-items: baseline; gap: var(--r2); margin-right: auto; }
.marca h1 { font-size: 1.05rem; }
.marca .sub { font-size: 0.75rem; color: var(--tinta-3); }

.uf-control {
  display: flex; align-items: center; gap: var(--r2);
  background: var(--superficie-2);
  border: 1px solid var(--borde);
  border-radius: var(--radio-s);
  padding: 5px var(--r2) 5px var(--r3);
  font-size: 0.78rem;
}
.uf-control label { color: var(--tinta-3); font-weight: 600; }
.uf-control input {
  width: 84px; border: 0; background: transparent; color: var(--tinta);
  font-family: var(--dato); font-size: 0.82rem; font-variant-numeric: tabular-nums;
  padding: 2px 0;
}
.uf-control input:focus { outline: none; }
.uf-control .fecha { color: var(--tinta-3); font-size: 0.68rem; white-space: nowrap; }

/* --- Resumen fijo -------------------------------------------------------- */

.resumen {
  max-width: var(--ancho); margin: 0 auto;
  padding: 0 var(--r4);
  display: flex; gap: var(--r5); align-items: flex-end; flex-wrap: wrap;
  padding-bottom: var(--r3);
}
.resumen-cifra { display: flex; flex-direction: column; gap: 2px; }
.resumen-cifra .valor {
  font-family: var(--dato); font-size: 1.9rem; font-weight: 600;
  letter-spacing: -0.03em; line-height: 1.05; font-variant-numeric: tabular-nums;
}
.resumen-cifra .valor.chico { font-size: 1.2rem; }
.resumen-cifra .pie { font-size: 0.75rem; color: var(--tinta-3); }
.resumen-chips { display: flex; gap: var(--r2); flex-wrap: wrap; margin-left: auto; }

/* --- Pestañas ------------------------------------------------------------ */

.pestanas {
  border-bottom: 1px solid var(--borde);
  background: var(--superficie);
  position: sticky; top: 0; z-index: 30;
}
.pestanas-fila {
  max-width: var(--ancho); margin: 0 auto; padding: 0 var(--r4);
  display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin;
}
.pestana {
  appearance: none; border: 0; background: transparent;
  font-family: var(--texto); font-size: 0.85rem; font-weight: 550;
  color: var(--tinta-3); cursor: pointer;
  padding: var(--r3) var(--r3);
  border-bottom: 2px solid transparent;
  white-space: nowrap; transition: color .15s, border-color .15s;
}
.pestana:hover { color: var(--tinta); }
.pestana[aria-selected="true"] { color: var(--acento); border-bottom-color: var(--acento); }

/* --- Estructura ---------------------------------------------------------- */

main { max-width: var(--ancho); margin: 0 auto; padding: var(--r5) var(--r4) var(--r7); }

.rejilla { display: grid; gap: var(--r4); align-items: start; }
/* Los hijos de grid traen min-width:auto, así que un contenido ancho (una tabla
   con celdas sin cortar) empuja la columna en vez de hacer scroll dentro de su
   propio contenedor. Esto lo devuelve al comportamiento esperado. */
.rejilla > *, .campos > *, .tarjeta { min-width: 0; }
@media (min-width: 860px) {
  .rejilla-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rejilla-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .rejilla-ancha { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
}

.tarjeta {
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: var(--r4);
  box-shadow: var(--sombra);
}
.tarjeta > header { margin-bottom: var(--r3); }
.tarjeta > header p { font-size: 0.83rem; color: var(--tinta-3); margin: var(--r1) 0 0; }
.tarjeta.plana { box-shadow: none; background: var(--superficie-2); }

/* --- Campos -------------------------------------------------------------- */

.campos { display: grid; gap: var(--r3); }
@media (min-width: 620px) { .campos-2 { grid-template-columns: 1fr 1fr; } }

.campo { display: flex; flex-direction: column; gap: 5px; }
.campo > label { font-size: 0.8rem; font-weight: 550; color: var(--tinta-2); }
.ayuda { font-size: 0.73rem; color: var(--tinta-3); line-height: 1.4; font-weight: 400; }
.campo .ayuda { display: block; }

.entrada {
  display: flex; align-items: center;
  border: 1px solid var(--borde-fuerte);
  border-radius: var(--radio-s);
  background: var(--superficie);
  transition: border-color .15s, box-shadow .15s;
}
.entrada:focus-within {
  border-color: var(--acento);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--acento) 18%, transparent);
}
.entrada input, .entrada select {
  flex: 1; min-width: 0;
  border: 0; background: transparent; color: var(--tinta);
  font-family: var(--dato); font-size: 0.9rem; font-variant-numeric: tabular-nums;
  padding: 9px var(--r3);
}
.entrada select { font-family: var(--texto); }
.entrada input:focus, .entrada select:focus { outline: none; }
.entrada .sufijo {
  font-size: 0.75rem; color: var(--tinta-3); padding-right: var(--r3);
  white-space: nowrap; font-weight: 600;
}
.entrada .equivalente {
  font-family: var(--dato); font-size: 0.72rem; color: var(--tinta-3);
  padding-right: var(--r3); white-space: nowrap;
}

.interruptor { display: flex; align-items: flex-start; gap: var(--r2); cursor: pointer; }
.interruptor input { margin: 3px 0 0; accent-color: var(--acento); width: 16px; height: 16px; flex: none; }
.interruptor span { font-size: 0.83rem; line-height: 1.45; }
.interruptor .ayuda { display: block; }

.segmentado { display: flex; border: 1px solid var(--borde-fuerte); border-radius: var(--radio-s); overflow: hidden; }
.segmentado button {
  flex: 1; appearance: none; border: 0; background: var(--superficie);
  font-family: var(--texto); font-size: 0.8rem; font-weight: 550; color: var(--tinta-2);
  padding: 8px var(--r2); cursor: pointer; white-space: nowrap;
  border-right: 1px solid var(--borde);
}
.segmentado button:last-child { border-right: 0; }
.segmentado button[aria-pressed="true"] { background: var(--acento-suave); color: var(--acento); }

/* --- Chips y semáforos --------------------------------------------------- */

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.75rem; font-weight: 600;
  padding: 4px 10px; border-radius: 999px;
  border: 1px solid transparent; white-space: nowrap;
}
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.chip.verde     { color: var(--bien);   background: var(--bien-fondo);   border-color: color-mix(in srgb, var(--bien) 28%, transparent); }
.chip.ambar     { color: var(--alerta); background: var(--alerta-fondo); border-color: color-mix(in srgb, var(--alerta) 28%, transparent); }
.chip.rojo      { color: var(--grave);  background: var(--grave-fondo);  border-color: color-mix(in srgb, var(--grave) 28%, transparent); }
.chip.sin-dato  { color: var(--neutro-estado); background: var(--neutro-estado-fondo); border-color: var(--borde); }
.chip.liso::before { display: none; }
.chip.liso { color: var(--tinta-2); background: var(--superficie-2); border-color: var(--borde); }

.senal {
  display: grid; grid-template-columns: 4px 1fr; gap: var(--r3);
  background: var(--superficie); border: 1px solid var(--borde);
  border-radius: var(--radio); overflow: hidden;
}
.senal .franja { background: var(--neutro-estado); }
.senal.verde .franja { background: var(--bien); }
.senal.ambar .franja { background: var(--alerta); }
.senal.rojo  .franja { background: var(--grave); }
.senal .cuerpo { padding: var(--r3) var(--r3) var(--r3) 0; display: flex; flex-direction: column; gap: 3px; }
.senal .titulo { display: flex; align-items: center; gap: var(--r2); justify-content: space-between; }
.senal .titulo h3 { font-size: 0.88rem; }
.senal .mensaje { font-size: 0.85rem; color: var(--tinta-2); }
.senal .detalle { font-size: 0.78rem; color: var(--tinta-3); }

/* --- Tablas -------------------------------------------------------------- */

.tabla-envoltorio {
  overflow-x: auto; max-width: 100%;
  border: 1px solid var(--borde); border-radius: var(--radio); background: var(--superficie);
}
table { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
th, td { padding: 9px var(--r3); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th {
  position: sticky; top: 0; background: var(--superficie-2);
  font-size: 0.7rem; font-weight: 650; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--tinta-3); border-bottom: 1px solid var(--borde);
}
tbody tr { border-bottom: 1px solid var(--borde); }
tbody tr:last-child { border-bottom: 0; }
tbody td.num, tbody td { font-variant-numeric: tabular-nums; }
td.num, th.num { font-family: var(--dato); }
tbody tr.destacada { background: var(--acento-suave); }
td .gana { color: var(--bien); font-weight: 650; }

/* --- Listas de desglose -------------------------------------------------- */

.desglose { display: flex; flex-direction: column; gap: 0; }
.desglose li {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--r3);
  padding: 7px 0; border-bottom: 1px dashed var(--borde); font-size: 0.85rem;
}
.desglose li:last-child { border-bottom: 0; }
.desglose li.total { border-top: 2px solid var(--borde-fuerte); border-bottom: 0; padding-top: 10px; margin-top: 4px; font-weight: 650; }
.desglose .concepto { color: var(--tinta-2); }
.desglose .concepto .ayuda { display: block; margin-top: 1px; }
.desglose .monto { font-family: var(--dato); font-variant-numeric: tabular-nums; white-space: nowrap; }
.desglose ul { list-style: none; margin: 0; padding: 0; }

/* --- Avisos -------------------------------------------------------------- */

.aviso {
  display: flex; gap: var(--r3); align-items: flex-start;
  padding: var(--r3); border-radius: var(--radio-s);
  font-size: 0.84rem; line-height: 1.5;
  border: 1px solid;
}
.aviso.error  { background: var(--grave-fondo);  border-color: color-mix(in srgb, var(--grave) 30%, transparent);  color: var(--grave); }
.aviso.alerta { background: var(--alerta-fondo); border-color: color-mix(in srgb, var(--alerta) 30%, transparent); color: var(--alerta); }
.aviso.info   { background: var(--acento-suave); border-color: var(--acento-borde); color: var(--acento); }
.aviso strong { font-weight: 650; }

.confianza { display: inline-flex; align-items: center; gap: 5px; font-size: 0.68rem; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
.confianza.alta  { color: var(--bien); }
.confianza.media { color: var(--alerta); }
.confianza.baja  { color: var(--grave); }

/* --- Botones ------------------------------------------------------------- */

.boton {
  appearance: none; cursor: pointer;
  font-family: var(--texto); font-size: 0.82rem; font-weight: 600;
  padding: 8px var(--r3); border-radius: var(--radio-s);
  border: 1px solid var(--borde-fuerte); background: var(--superficie); color: var(--tinta);
  transition: background .15s, border-color .15s;
}
.boton:hover { border-color: var(--acento); color: var(--acento); }
.boton.primario { background: var(--acento); border-color: var(--acento); color: var(--superficie); }
:root[data-theme="dark"] .boton.primario,
:root:not([data-theme="light"]) .boton.primario { color: #06110f; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .boton.primario { color: #fff; } }
.boton.primario:hover { background: var(--acento-fuerte); border-color: var(--acento-fuerte); }
.boton.peligro:hover { border-color: var(--grave); color: var(--grave); }
.acciones { display: flex; gap: var(--r2); flex-wrap: wrap; }

/* --- Gráficos ------------------------------------------------------------ */

.grafico { width: 100%; overflow-x: auto; }
.grafico svg { display: block; max-width: 100%; height: auto; }
.leyenda { display: flex; gap: var(--r4); flex-wrap: wrap; font-size: 0.78rem; color: var(--tinta-2); margin-top: var(--r2); }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.leyenda i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex: none; }
.eje { font-family: var(--dato); font-size: 10px; fill: var(--tinta-3); }
/* Las etiquetas de categoría son prosa, no cifras: van en la tipografía de
   texto. La monoespaciada se reserva para los números, que es donde alinear
   dígitos sirve de algo. */
.eje-texto { font-family: var(--texto); font-size: 11px; fill: var(--tinta-2); }
.rejilla-linea { stroke: var(--rejilla); stroke-width: 1; }

.sugerencia {
  position: fixed; z-index: 60; pointer-events: none;
  background: var(--tinta); color: var(--fondo);
  padding: 7px 10px; border-radius: var(--radio-s);
  font-size: 0.76rem; line-height: 1.45; box-shadow: var(--sombra);
  max-width: 240px;
}
.sugerencia .t { font-weight: 650; display: block; margin-bottom: 2px; }
.sugerencia .f { display: flex; justify-content: space-between; gap: var(--r3); font-family: var(--dato); font-variant-numeric: tabular-nums; }

.mensaje-flotante {
  position: fixed; z-index: 70; left: 50%; bottom: var(--r5);
  transform: translateX(-50%);
  background: var(--tinta); color: var(--fondo);
  padding: 10px var(--r4); border-radius: var(--radio);
  font-size: 0.84rem; box-shadow: var(--sombra);
  max-width: min(90vw, 420px); text-align: center;
}

/* --- Acordeón ------------------------------------------------------------ */

details.bloque {
  background: var(--superficie); border: 1px solid var(--borde);
  border-radius: var(--radio); overflow: hidden;
}
details.bloque + details.bloque { margin-top: var(--r3); }
details.bloque > summary {
  cursor: pointer; list-style: none; padding: var(--r3) var(--r4);
  display: flex; align-items: center; gap: var(--r2);
  font-family: var(--display); font-weight: 650; font-size: 0.95rem;
}
details.bloque > summary::-webkit-details-marker { display: none; }
details.bloque > summary::after {
  content: "＋"; margin-left: auto; color: var(--tinta-3); font-size: 1rem; font-weight: 400;
}
details.bloque[open] > summary::after { content: "－"; }
details.bloque[open] > summary { border-bottom: 1px solid var(--borde); }
details.bloque .contenido { padding: var(--r4); }
summary .resumen-bloque { font-family: var(--texto); font-weight: 500; font-size: 0.78rem; color: var(--tinta-3); }

/* --- Pie ----------------------------------------------------------------- */

.pie-legal {
  max-width: var(--ancho); margin: 0 auto; padding: var(--r5) var(--r4) var(--r6);
  font-size: 0.78rem; color: var(--tinta-3); line-height: 1.6;
  border-top: 1px solid var(--borde);
}
.pie-legal strong { color: var(--tinta-2); }

@media (max-width: 640px) {
  .resumen-cifra .valor { font-size: 1.5rem; }
  main { padding: var(--r4) var(--r3) var(--r6); }
  .cabecera-fila { padding: var(--r3); gap: var(--r2); }
  .resumen { padding: 0 var(--r3) var(--r3); gap: var(--r4); }

 *
 * La convención importa y es la causa habitual de que dos simuladores den
 * números distintos para el mismo crédito. En los mutuos hipotecarios chilenos

 * así que la app deja elegir y muestra cuál está usando.

function tasaMensual(tasaAnual, convencion = 'nominal') {
  if (convencion === 'efectiva') return Math.pow(1 + tasaAnual, 1 / 12) - 1;
  return tasaAnual / 12;

 * Cuota de un crédito con amortización francesa (cuota constante).
 *   C = P·i / (1 − (1+i)^−n)

 * @param {number} i tasa del período
 * @param {number} n número de períodos
 */
function cuotaFrancesa(capital, i, n) {
  if (n <= 0) throw new Error('El plazo debe ser mayor que cero.');
  if (capital <= 0) return 0;
  if (i === 0) return capital / n;
  return (capital * i) / (1 - Math.pow(1 + i, -n));
}

 * Capital que puedes pedir dado el máximo que puedes pagar por mes.
 * Es la inversa exacta de cuotaFrancesa.
 */
function capitalDesdeCuota(cuota, i, n) {
  if (n <= 0) return 0;
  if (cuota <= 0) return 0;
  if (i === 0) return cuota * n;
  return (cuota * (1 - Math.pow(1 + i, -n))) / i;

 * @typedef {Object} FilaAmortizacion
 * @property {number} mes 1..n
 * @property {number} cuota

 * @property {number} amortizacion
 * @property {number} saldo saldo insoluto al cierre del mes
 * @property {number} abonoExtra
 */

 * Tabla de amortización mes a mes, con soporte para abonos extraordinarios.
 *
 * @param {Object} p
 * @param {number} p.capital
 * @param {number} p.i tasa mensual
 * @param {number} p.n plazo en meses
 * @param {number} [p.abonoMensual] abono extra a capital, todos los meses
 * @param {number} [p.abonoAnual] abono extra a capital, una vez al año
 * @param {number} [p.mesAbonoAnual=12] mes del año en que cae el abono anual
 * @param {'plazo'|'cuota'} [p.modoAbono='plazo'] reducir plazo o recalcular cuota
 * @returns {{filas: FilaAmortizacion[], totalInteres: number, totalPagado: number, meses: number}}
 */
function tablaAmortizacion({
  capital,
  i,
  n,
  abonoMensual = 0,
  abonoAnual = 0,
  mesAbonoAnual = 12,
  modoAbono = 'plazo',
}) {
  const filas = [];
  let saldo = capital;
  let cuota = cuotaFrancesa(capital, i, n);
  let totalInteres = 0;
  let totalPagado = 0;

  for (let mes = 1; mes <= n && saldo > 1e-9; mes++) {
    const interes = saldo * i;
    let amortizacion = cuota - interes;

    // Si la cuota no alcanza a cubrir el interés el crédito nunca se paga.
    if (amortizacion <= 0 && abonoMensual <= 0 && abonoAnual <= 0) {
      throw new Error('La cuota no cubre el interés: el crédito no se amortiza.');
    }

    let extra = abonoMensual;
    if (abonoAnual > 0 && mes % 12 === mesAbonoAnual % 12) extra += abonoAnual;

    // Última cuota: nunca pagar más que el saldo.
    if (amortizacion + extra >= saldo) {
      amortizacion = Math.min(amortizacion, saldo);
      extra = Math.max(0, saldo - amortizacion);
    }

    const pagado = interes + amortizacion + extra;
    saldo = saldo - amortizacion - extra;
    if (Math.abs(saldo) < 1e-9) saldo = 0;

    totalInteres += interes;
    totalPagado += pagado;
    filas.push({ mes, cuota: interes + amortizacion, interes, amortizacion, saldo, abonoExtra: extra });

    // En modo "reducir cuota" el abono baja el dividendo y deja el plazo igual.
    if (modoAbono === 'cuota' && extra > 0 && saldo > 0) {
      cuota = cuotaFrancesa(saldo, i, n - mes);
    }
  }

  return { filas, totalInteres, totalPagado, meses: filas.length };
}

/** Valor actual neto de una serie de flujos, con el flujo 0 en t=0. */
function van(flujos, tasa) {
  let acc = 0;
  for (let t = 0; t < flujos.length; t++) acc += flujos[t] / Math.pow(1 + tasa, t);
  return acc;
}

/**
 * Tasa interna de retorno por período.
 *
 * Bisección sobre un intervalo con cambio de signo: más lenta que
 * Newton-Raphson pero converge siempre, que es lo que quieres cuando el
 * resultado va a orientar una decisión de 25 años. Devuelve null si los flujos
 * no tienen solución (por ejemplo, si nunca cambian de signo).
 *
 * @param {number[]} flujos
 * @param {number} [tolerancia=1e-9]
 * @returns {number|null}
 */
function tir(flujos, tolerancia = 1e-9) {
  const tieneNegativo = flujos.some((f) => f < 0);
  const tienePositivo = flujos.some((f) => f > 0);
  if (!tieneNegativo || !tienePositivo) return null;

  let lo = -0.9999;
  let hi = 1;
  let vLo = van(flujos, lo);
  let vHi = van(flujos, hi);

  // Ensanchar el extremo superior hasta encontrar cambio de signo.
  let intentos = 0;
  while (vLo * vHi > 0 && intentos < 200) {
    hi *= 2;
    vHi = van(flujos, hi);
    intentos++;
  }
  if (vLo * vHi > 0) return null;

  // Dos tolerancias distintas: una sobre el valor del VAN y otra, mucho más
  // fina, sobre el ancho del intervalo. Si se cortara por el ancho con la misma
  // tolerancia, en flujos grandes el VAN residual quedaría varios órdenes de
  // magnitud por encima de lo pedido.
  const tolIntervalo = 1e-13;
  for (let k = 0; k < 300; k++) {
    const mid = (lo + hi) / 2;
    const vMid = van(flujos, mid);
    if (Math.abs(vMid) < tolerancia || (hi - lo) / 2 < tolIntervalo) return mid;
    if (vLo * vMid < 0) {
      hi = mid;
      vHi = vMid;
    } else {
      lo = mid;
      vLo = vMid;
    }
  }
  return (lo + hi) / 2;
}

/** Anualiza una tasa mensual de forma compuesta. */
function anualizar(tasaMes) {
  return Math.pow(1 + tasaMes, 12) - 1;
}

/**
 * Carga Anual Equivalente.
 *
 * Es la TIR del flujo que realmente vives: recibes el crédito menos los gastos
 * que te cobran al firmar, y pagas el dividendo completo (cuota + seguros +
 * comisiones). Por construcción siempre es mayor que la tasa nominal cuando hay
 * seguros o gastos, y es la única cifra que permite comparar dos ofertas de
 * bancos distintos de manera justa.
 *
 * @param {number} montoCredito
 * @param {number} gastosIniciales descontados del neto recibido
 * @param {number[]} dividendos pagos mensuales, mes 1 en adelante
 * @returns {number|null} tasa anual
 */
function cae(montoCredito, gastosIniciales, dividendos) {
  const flujos = [montoCredito - gastosIniciales, ...dividendos.map((d) => -d)];
  const mensual = tir(flujos);
  return mensual === null ? null : anualizar(mensual);
}

/** Redondeo a n decimales, evitando el ruido binario del punto flotante. */
function redondear(x, decimales = 2) {
  const f = Math.pow(10, decimales);
  return Math.round((x + Number.EPSILON) * f) / f;

/** Acota un número a un intervalo. */
function acotar(x, min, max) {
  return Math.min(max, Math.max(min, x));
}

/**
 * Formato numérico chileno: coma decimal y punto de miles.
 *
 * Vive en el motor y no en la interfaz porque varias funciones devuelven textos
 * ya redactados para leer, y "UF 1.66" en vez de "UF 1,66" delata que el número
 * lo escribió una máquina que no piensa en español.
 */
function cl(x, decimales = 0) {
  if (x == null || !Number.isFinite(x)) return '—';
  return x.toLocaleString('es-CL', {
    minimumFractionDigits: decimales,
    maximumFractionDigits: decimales,
  });
}
