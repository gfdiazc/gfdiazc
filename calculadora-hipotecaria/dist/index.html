/**
 * Piezas reutilizables de interfaz. Devuelven HTML como texto; el estado se
 * enlaza por `data-ruta`, y un único escuchador delegado en app.js se encarga
 * de leer, convertir y escribir.
 */



/**
 * Campo de entrada.
 *
 * @param {Object} p
 * @param {string} p.ruta ruta dentro de la entrada, p.ej. 'credito.tasaAnual'
 * @param {string} p.etiqueta
 * @param {'uf'|'clp'|'pct'|'pctFino'|'numero'|'texto'|'bool'|'select'|'lista'} p.tipo
 * @param {string} [p.sufijo]
 * @param {string} [p.ayuda]
 * @param {Array} [p.opciones] para tipo select: [{valor, texto}]
 * @param {string} [p.paso]
 */
function campo({ ruta, etiqueta, tipo, sufijo, ayuda, opciones, paso, marcador }) {
  const id = `c-${ruta.replace(/\./g, '-')}`;
  const ayudaHtml = ayuda ? `<span class="ayuda" id="${id}-ayuda">${esc(ayuda)}</span>` : '';
  const descrito = ayuda ? ` aria-describedby="${id}-ayuda"` : '';

  if (tipo === 'bool') {
    return `<label class="interruptor" for="${id}">
      <input type="checkbox" id="${id}" data-ruta="${ruta}" data-tipo="bool"${descrito}>
      <span>${esc(etiqueta)}${ayudaHtml}</span>
    </label>`;
  }

  if (tipo === 'select') {
    const ops = opciones.map((o) => `<option value="${esc(o.valor)}">${esc(o.texto)}</option>`).join('');
    return `<div class="campo">
      <label for="${id}">${esc(etiqueta)}</label>
      <div class="entrada"><select id="${id}" data-ruta="${ruta}" data-tipo="texto"${descrito}>${ops}</select></div>
      ${ayudaHtml}
    </div>`;
  }

  const esNumero = tipo !== 'texto' && tipo !== 'lista';
  const equivalente = tipo === 'uf' ? `<span class="equivalente" data-equivalente="${ruta}"></span>` : '';

  return `<div class="campo">
    <label for="${id}">${esc(etiqueta)}</label>
    <div class="entrada">
      <input id="${id}" data-ruta="${ruta}" data-tipo="${tipo}"
             type="${esNumero ? 'text' : 'text'}" inputmode="${esNumero ? 'decimal' : 'text'}"
             ${paso ? `data-paso="${paso}"` : ''}
             ${marcador ? `placeholder="${esc(marcador)}"` : ''}${descrito}>
      ${equivalente}
      ${sufijo ? `<span class="sufijo">${esc(sufijo)}</span>` : ''}
    </div>
    ${ayudaHtml}
  </div>`;
}

function bloque({ titulo, resumen, abierto, contenido }) {
  return `<details class="bloque"${abierto ? ' open' : ''}>
    <summary>${esc(titulo)}${resumen ? ` <span class="resumen-bloque">${esc(resumen)}</span>` : ''}</summary>
    <div class="contenido">${contenido}</div>

}

function tarjeta({ titulo, descripcion, contenido, clase = '' }) {

function chip(estado, texto) {

function chipLiso(texto) {

function senal(s) {

function etiquetaSemaforo(s) {
  return { verde: 'En orden', ambar: 'Atención', rojo: 'Problema', 'sin-dato': 'Sin dato' }[s] || s;
}

/**
 * Lista de desglose. `filas` es [{concepto, monto, nota, total}].
 */
function desglose(filas, formato) {
  const li = filas.map((f) => `<li${f.total ? ' class="total"' : ''}>
      <span class="concepto">${esc(f.concepto)}${f.nota ? ` <span class="ayuda">${esc(f.nota)}</span>` : ''}</span>
      <span class="monto">${esc(formato(f.monto))}</span>

  return `<ul class="desglose">${li}</ul>`;
}

/**
 * Tabla genérica. `columnas` es [{clave, titulo, formato, alineacion}].
 */
function tabla(columnas, filas, { destacar } = {}) {
  const th = columnas.map((c) => `<th class="${c.num === false ? '' : 'num'}">${esc(c.titulo)}</th>`).join('');
  const tr = filas.map((f, i) => {
    const td = columnas.map((c) => {
      const v = c.obtener(f, i);
      const cls = c.num === false ? '' : 'num';
      const marca = c.ganador && c.ganador(f, i) ? ' class="gana"' : '';
      return `<td class="${cls}"><span${marca}>${v}</span></td>`;
    }).join('');
    return `<tr${destacar && destacar(f, i) ? ' class="destacada"' : ''}>${td}</tr>`;
  }).join('');
  return `<div class="tabla-envoltorio"><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
}

function aviso(nivel, texto) {

function cifra({ valor, etiqueta, pie, chica }) {

  </div>`;
}

function insigniaConfianza(nivel) {
  const texto = { alta: 'Confianza alta', media: 'Verifica', baja: 'Cotiza esto' }[nivel] || nivel;
  return `<span class="confianza ${esc(nivel)}">${esc(texto)}</span>`;
}

/* ===== src/ui/graficos.js ===== */
/**
 * Gráficos en SVG, escritos a mano. Sin librerías: la app tiene que funcionar
 * como un archivo suelto, sin red.
 *
 * Reglas que se respetan en todos: trazos de 2px, extremos redondeados de 4px
 * anclados a la línea base, rejilla recesiva, leyenda siempre que haya dos o
 * más series, y capa de hover con lectura de valores.
 */



const NS = 'http://www.w3.org/2000/svg';

function el(nombre, atributos = {}, hijos = []) {
  const n = document.createElementNS(NS, nombre);
  for (const [k, v] of Object.entries(atributos)) {
    if (v != null) n.setAttribute(k, String(v));
  }
  for (const h of [].concat(hijos)) if (h) n.append(h);
  return n;
}

/** Tooltip único compartido por todos los gráficos. */
let globo = null;
function obtenerGlobo() {
  if (!globo) {
    globo = document.createElement('div');
    globo.className = 'sugerencia';
    globo.hidden = true;
    document.body.append(globo);
  }
  return globo;
}
function mostrarGlobo(evento, html) {
  const g = obtenerGlobo();
  g.innerHTML = html;
  g.hidden = false;
  const r = g.getBoundingClientRect();
  const x = Math.min(evento.clientX + 14, window.innerWidth - r.width - 8);
  const y = Math.max(8, evento.clientY - r.height - 12);
  g.style.left = `${x}px`;
  g.style.top = `${y}px`;
}
function ocultarGlobo() { if (globo) globo.hidden = true; }

function leerColor(nombre) {
  return getComputedStyle(document.documentElement).getPropertyValue(nombre).trim() || '#888';
}

function envolver(svg, leyenda) {
  const cont = document.createElement('div');
  cont.className = 'grafico';
  cont.append(svg);
  if (leyenda?.length) {
    const l = document.createElement('div');
    l.className = 'leyenda';
    for (const item of leyenda) {
      const s = document.createElement('span');
      const i = document.createElement('i');
      i.style.background = item.color;
      s.append(i, document.createTextNode(item.texto));
      l.append(s);
    }
    cont.append(l);
  }
  return cont;
}

function ejes(g, { x0, x1, y0, y1, ticks, formatoY, etiquetasX }) {
  const rejilla = leerColor('--rejilla');
  for (const t of ticks) {
    g.append(el('line', {
      x1: x0, x2: x1, y1: t.y, y2: t.y,
      stroke: rejilla, 'stroke-width': 1,
    }));
    const texto = el('text', { x: x0 - 8, y: t.y + 3, 'text-anchor': 'end', class: 'eje' });
    texto.textContent = formatoY(t.valor);
    g.append(texto);
  }
  for (const e of etiquetasX || []) {
    const texto = el('text', { x: e.x, y: y1 + 16, 'text-anchor': 'middle', class: 'eje' });
    texto.textContent = e.texto;
    g.append(texto);
  }
}

function calcularTicks(min, max, y0, y1, cantidad = 4) {
  const rango = max - min || 1;
  const paso = rango / cantidad;
  const ticks = [];
  for (let k = 0; k <= cantidad; k++) {
    const valor = min + paso * k;
    ticks.push({ valor, y: y1 - ((valor - min) / rango) * (y1 - y0) });
  }
  return ticks;
}

/* ------------------------------------------------------------------ */
/* Composición del dividendo: cuánto se va en interés y cuánto amortiza */
/* ------------------------------------------------------------------ */

function graficoAmortizacion(filas, { valorUF, enPesos }) {
  const ANCHO = 720, ALTO = 260;
  const m = { arriba: 12, derecha: 12, abajo: 26, izquierda: 56 };
  const x0 = m.izquierda, x1 = ANCHO - m.derecha;
  const y0 = m.arriba, y1 = ALTO - m.abajo;

  const n = filas.length;
  const maxCuota = Math.max(...filas.map((f) => f.interes + f.amortizacion));
  const escalaX = (i) => x0 + (i / Math.max(1, n - 1)) * (x1 - x0);
  const escalaY = (v) => y1 - (v / maxCuota) * (y1 - y0);
  const conv = (v) => (enPesos ? v * valorUF : v);
  const fmt = (v) => (enPesos ? clp(conv(v)) : uf(v));

  const svg = el('svg', {
    viewBox: `0 0 ${ANCHO} ${ALTO}`, width: '100%', role: 'img',
    'aria-label': 'Composición del dividendo mes a mes entre interés y amortización de capital',
  });
  const g = el('g');
  svg.append(g);

  ejes(g, {
    x0, x1, y0, y1,
    ticks: calcularTicks(0, maxCuota, y0, y1, 4),
    formatoY: (v) => (enPesos ? Math.round(conv(v) / 1000) + 'k' : numero(v, 0)),
    etiquetasX: [0, 0.25, 0.5, 0.75, 1].map((p) => ({
      x: x0 + p * (x1 - x0),
      texto: `Año ${Math.round((p * (n - 1)) / 12)}`,
    })),
  });

  // Área de interés (abajo) y de capital (encima), con 2px de separación.
  const puntosInteres = filas.map((f, i) => `${escalaX(i)},${escalaY(f.interes)}`);
  const puntosTotal = filas.map((f, i) => `${escalaX(i)},${escalaY(f.interes + f.amortizacion)}`);

  g.append(el('polygon', {
    points: `${x0},${y1} ${puntosInteres.join(' ')} ${x1},${y1}`,
    fill: leerColor('--serie-2'), 'fill-opacity': 0.85,
  }));
  g.append(el('polygon', {
    points: `${puntosInteres.join(' ')} ${[...puntosTotal].reverse().join(' ')}`,
    fill: leerColor('--serie-1'), 'fill-opacity': 0.85,
    stroke: leerColor('--superficie'), 'stroke-width': 2, 'stroke-linejoin': 'round',
  }));

  // Capa de hover con línea guía.
  const guia = el('line', {
    y1: y0, y2: y1, stroke: leerColor('--tinta-3'), 'stroke-width': 1,
    'stroke-dasharray': '3 3', opacity: 0,
  });
  g.append(guia);
  const zona = el('rect', { x: x0, y: y0, width: x1 - x0, height: y1 - y0, fill: 'transparent' });
  g.append(zona);

  zona.addEventListener('mousemove', (ev) => {
    const caja = svg.getBoundingClientRect();
    const px = ((ev.clientX - caja.left) / caja.width) * ANCHO;
    const i = Math.round(((px - x0) / (x1 - x0)) * (n - 1));
    const f = filas[Math.max(0, Math.min(n - 1, i))];
    if (!f) return;
    guia.setAttribute('x1', escalaX(f.mes - 1));
    guia.setAttribute('x2', escalaX(f.mes - 1));
    guia.setAttribute('opacity', '1');
    mostrarGlobo(ev, `
      <span class="t">Mes ${f.mes} · año ${Math.ceil(f.mes / 12)}</span>
      <span class="f"><span>Interés</span><span>${fmt(f.interes)}</span></span>
      <span class="f"><span>Capital</span><span>${fmt(f.amortizacion)}</span></span>
      <span class="f"><span>Saldo</span><span>${fmt(f.saldo)}</span></span>`);
  });
  zona.addEventListener('mouseleave', () => { guia.setAttribute('opacity', '0'); ocultarGlobo(); });

  return envolver(svg, [
    { color: leerColor('--serie-2'), texto: 'Interés (se lo lleva el banco)' },
    { color: leerColor('--serie-1'), texto: 'Capital (queda para ti)' },
  ]);
}

/* ---------------------------------------------- */
/* Patrimonio: comprar contra arrendar e invertir  */
/* ---------------------------------------------- */

function graficoPatrimonio(serie, { valorUF, enPesos, anioDeCruce }) {
  const ANCHO = 720, ALTO = 260;
  const m = { arriba: 14, derecha: 14, abajo: 26, izquierda: 62 };
  const x0 = m.izquierda, x1 = ANCHO - m.derecha;
  const y0 = m.arriba, y1 = ALTO - m.abajo;

  const valores = serie.flatMap((s) => [s.patrimonioComprarUF, s.patrimonioArrendarUF]);
  const min = Math.min(0, ...valores);
  const max = Math.max(...valores);
  const escalaX = (a) => x0 + ((a - serie[0].anio) / Math.max(1, serie.length - 1)) * (x1 - x0);
  const escalaY = (v) => y1 - ((v - min) / (max - min || 1)) * (y1 - y0);
  const conv = (v) => (enPesos ? v * valorUF : v);
  const fmt = (v) => (enPesos ? clp(conv(v)) : uf(v, 0));

  const svg = el('svg', {
    viewBox: `0 0 ${ANCHO} ${ALTO}`, width: '100%', role: 'img',
    'aria-label': 'Patrimonio proyectado comprando frente a arrendar e invertir la diferencia',
  });
  const g = el('g');
  svg.append(g);

  ejes(g, {
    x0, x1, y0, y1,
    ticks: calcularTicks(min, max, y0, y1, 4),
    formatoY: (v) => (enPesos ? Math.round(conv(v) / 1e6) + 'M' : numero(v, 0)),
    etiquetasX: serie
      .filter((_, i) => i % Math.ceil(serie.length / 6) === 0 || i === serie.length - 1)
      .map((s) => ({ x: escalaX(s.anio), texto: `A${s.anio}` })),
  });

  if (min < 0) {
    g.append(el('line', {
      x1: x0, x2: x1, y1: escalaY(0), y2: escalaY(0),
      stroke: leerColor('--borde-fuerte'), 'stroke-width': 1,
    }));
  }

  const linea = (clave, color) => {
    const d = serie.map((s, i) => `${i === 0 ? 'M' : 'L'}${escalaX(s.anio)},${escalaY(s[clave])}`).join(' ');
    g.append(el('path', {
      d, fill: 'none', stroke: color, 'stroke-width': 2,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round',
    }));
    const ultimo = serie[serie.length - 1];
    g.append(el('circle', {
      cx: escalaX(ultimo.anio), cy: escalaY(ultimo[clave]), r: 4.5,
      fill: color, stroke: leerColor('--superficie'), 'stroke-width': 2,
    }));
  };
  linea('patrimonioArrendarUF', leerColor('--serie-3'));
  linea('patrimonioComprarUF', leerColor('--serie-1'));

  if (anioDeCruce && anioDeCruce >= serie[0].anio && anioDeCruce <= serie[serie.length - 1].anio) {
    g.append(el('line', {
      x1: escalaX(anioDeCruce), x2: escalaX(anioDeCruce), y1: y0, y2: y1,
      stroke: leerColor('--tinta-3'), 'stroke-width': 1, 'stroke-dasharray': '4 3',
    }));
    const t = el('text', { x: escalaX(anioDeCruce) + 5, y: y0 + 11, class: 'eje-texto' });
    t.textContent = `cruce año ${numero(anioDeCruce, 1)}`;
    g.append(t);
  }

  const zona = el('rect', { x: x0, y: y0, width: x1 - x0, height: y1 - y0, fill: 'transparent' });
  g.append(zona);
  zona.addEventListener('mousemove', (ev) => {
    const caja = svg.getBoundingClientRect();
    const px = ((ev.clientX - caja.left) / caja.width) * ANCHO;
    const idx = Math.round(((px - x0) / (x1 - x0)) * (serie.length - 1));
    const s = serie[Math.max(0, Math.min(serie.length - 1, idx))];
    if (!s) return;
    mostrarGlobo(ev, `
      <span class="t">Año ${s.anio}</span>
      <span class="f"><span>Comprar</span><span>${fmt(s.patrimonioComprarUF)}</span></span>
      <span class="f"><span>Arrendar</span><span>${fmt(s.patrimonioArrendarUF)}</span></span>
      <span class="f"><span>Diferencia</span><span>${fmt(s.diferenciaUF)}</span></span>`);
  });
  zona.addEventListener('mouseleave', ocultarGlobo);

  return envolver(svg, [
    { color: leerColor('--serie-1'), texto: 'Comprar: valor de la propiedad menos deuda' },
    { color: leerColor('--serie-3'), texto: 'Arrendar: el pie y la diferencia, invertidos' },
  ]);
}

/* ------------------------------------------ */
/* Tornado: qué supuesto mueve más el dividendo */
/* ------------------------------------------ */

function graficoTornado(filas, base, { valorUF, enPesos }) {
  const utilizables = filas.filter((f) => f.impacto > 0).slice(0, 6);
  if (!utilizables.length) return document.createElement('div');

  const ALTO_FILA = 34;
  const ANCHO = 720;
  const ALTO = utilizables.length * ALTO_FILA + 30;
  const izquierda = 190, derecha = ANCHO - 16;
  const centro = izquierda + (derecha - izquierda) / 2;
  const maxImpacto = Math.max(...utilizables.map((f) => f.impacto));
  const media = (derecha - izquierda) / 2;
  const conv = (v) => (enPesos ? v * valorUF : v);
  const fmt = (v) => (enPesos ? clp(conv(v)) : uf(v));

  const svg = el('svg', {
    viewBox: `0 0 ${ANCHO} ${ALTO}`, width: '100%', role: 'img',
    'aria-label': 'Sensibilidad del dividendo a cada supuesto, ordenada por impacto',
  });
  const g = el('g');
  svg.append(g);

  g.append(el('line', {
    x1: centro, x2: centro, y1: 4, y2: ALTO - 26,
    stroke: leerColor('--borde-fuerte'), 'stroke-width': 1,
  }));

  utilizables.forEach((f, i) => {
    const y = 8 + i * ALTO_FILA;
    const etiqueta = el('text', { x: izquierda - 12, y: y + 15, 'text-anchor': 'end', class: 'eje-texto' });
    etiqueta.textContent = f.etiqueta;
    g.append(etiqueta);

    for (const lado of ['deltaBajo', 'deltaAlto']) {
      const d = f[lado];
      if (d == null || d === 0) continue;
      const largo = (Math.abs(d) / maxImpacto) * media;
      // Baja el dividendo (bueno) hacia la izquierda; lo sube (malo) a la derecha.
      const esBueno = d < 0;
      const x = esBueno ? centro - largo : centro;
      const barra = el('rect', {
        x, y: y + 4, width: Math.max(2, largo), height: 15,
        rx: 4, ry: 4,
        fill: esBueno ? leerColor('--bien') : leerColor('--grave'),
        'fill-opacity': 0.9,
      });
      barra.addEventListener('mousemove', (ev) => mostrarGlobo(ev, `
        <span class="t">${f.etiqueta}</span>
        <span class="f"><span>${lado === 'deltaBajo' ? 'Escenario bajo' : 'Escenario alto'}</span><span></span></span>
        <span class="f"><span>Dividendo</span><span>${fmt(base + d)}</span></span>
        <span class="f"><span>Cambio</span><span>${d > 0 ? '+' : ''}${fmt(d)}</span></span>`));
      barra.addEventListener('mouseleave', ocultarGlobo);
      g.append(barra);
    }
  });

  const pie1 = el('text', { x: centro - 10, y: ALTO - 8, 'text-anchor': 'end', class: 'eje-texto' });
  pie1.textContent = '← baja el dividendo';
  const pie2 = el('text', { x: centro + 10, y: ALTO - 8, class: 'eje-texto' });
  pie2.textContent = 'sube el dividendo →';
  g.append(pie1, pie2);

  return envolver(svg, [
    { color: leerColor('--bien'), texto: 'A tu favor' },
    { color: leerColor('--grave'), texto: 'En tu contra' },
  ]);
}

/* -------------------------------------- */
/* Barras simples (ahorro del Art. 55 bis) */
/* -------------------------------------- */

function graficoBarras(datos, { formato = (v) => numero(v, 0), titulo = '' } = {}) {
  if (!datos.length) return document.createElement('div');
  const ANCHO = 720, ALTO = 180;
  const m = { arriba: 12, derecha: 12, abajo: 24, izquierda: 62 };
  const x0 = m.izquierda, x1 = ANCHO - m.derecha, y0 = m.arriba, y1 = ALTO - m.abajo;
  const max = Math.max(...datos.map((d) => d.valor), 1);
  const paso = (x1 - x0) / datos.length;
  const ancho = Math.max(4, paso - 6);

  const svg = el('svg', {
    viewBox: `0 0 ${ANCHO} ${ALTO}`, width: '100%', role: 'img', 'aria-label': titulo,
  });
  const g = el('g');
  svg.append(g);

  ejes(g, {
    x0, x1, y0, y1,
    ticks: calcularTicks(0, max, y0, y1, 3),
    formatoY: formato,
    etiquetasX: datos.map((d, i) => ({ x: x0 + paso * i + paso / 2, texto: d.etiqueta })),
  });

  datos.forEach((d, i) => {
    const alto = (d.valor / max) * (y1 - y0);
    const barra = el('rect', {
      x: x0 + paso * i + (paso - ancho) / 2,
      y: y1 - alto, width: ancho, height: Math.max(1, alto),
      rx: 4, ry: 4, fill: leerColor('--serie-1'), 'fill-opacity': 0.9,
    });
    barra.addEventListener('mousemove', (ev) => mostrarGlobo(ev, `
      <span class="t">${d.etiqueta}</span>
      <span class="f"><span>${d.nombre || 'Valor'}</span><span>${d.texto || formato(d.valor)}</span></span>`));
    barra.addEventListener('mouseleave', ocultarGlobo);
    g.append(barra);
  });

  return envolver(svg, null);
}

        { concepto: 'Menos vacancia', monto: -(inv.arriendoBrutoAnualUF - inv.ingresoEfectivoAnualUF) },
        { concepto: 'Menos gastos operativos', monto: -inv.gastosOperativosAnualUF, nota: 'administración, mantención, contribuciones' },
        { concepto: 'NOI (resultado operacional)', monto: inv.noiUF },
        { concepto: 'Menos dividendos del año', monto: -inv.servicioDeudaAnualUF },
        { concepto: 'Flujo anual', monto: inv.flujoNetoUF, total: true },
      ], p)}
      <div class="rejilla rejilla-3" style="margin-top:var(--r4)">
        <div><span class="etiqueta">Cap rate bruto</span><div class="num" style="font-size:1.15rem">${pct(inv.capRateBruto)}</div></div>
        <div><span class="etiqueta">Cap rate neto</span><div class="num" style="font-size:1.15rem">${pct(inv.capRateNeto)}</div></div>
        <div><span class="etiqueta">Cash-on-cash</span><div class="num" style="font-size:1.15rem">${pct(inv.cashOnCash)}</div></div>
      </div>
      <p class="ayuda" style="margin-top:var(--r3)">
        Arriendo de equilibrio (flujo cero): <strong>${uf(r.equilibrio.arriendoMensualEquilibrioUF)}</strong> al mes.
        ${r.equilibrio.holguraUF >= 0
          ? `Tu arriendo lo supera por ${uf(r.equilibrio.holguraUF)}.`
          : `Te faltan ${uf(Math.abs(r.equilibrio.holguraUF))} para llegar ahí.`}
      </p>`,
  }) : '';

  return `
    ${avisos}
    <div class="rejilla rejilla-2">
      ${tarjeta({ titulo: 'De qué se compone tu dividendo', descripcion: 'El primer mes. El desgravamen baja con el saldo, así que el dividendo también.', contenido: desgloseDividendo })}
      ${tarjeta({ titulo: 'Qué necesitas para firmar', descripcion: 'Plata que tiene que estar disponible el día de la escritura.', contenido: desgloseEntrada })}
    </div>

    ${tarjeta({
      titulo: 'El crédito completo',
      contenido: `<div class="rejilla rejilla-3">
        <div><span class="etiqueta">Costo real (CAE)</span><div class="num" style="font-size:1.15rem">${pct(c.caeAnual)}</div><span class="ayuda">contra ${pct(r.programas.tasaEfectiva)} de tasa</span></div>
        <div><span class="etiqueta">Interés total</span><div class="num" style="font-size:1.15rem">${uf(c.totalInteresUF, 0)}</div><span class="ayuda">${clp(c.totalInteresUF * vUF)}</span></div>
        <div><span class="etiqueta">Seguros totales</span><div class="num" style="font-size:1.15rem">${uf(c.totalSegurosUF, 0)}</div><span class="ayuda">${clp(c.totalSegurosUF * vUF)}</span></div>
        <div><span class="etiqueta">Desembolso total</span><div class="num" style="font-size:1.15rem">${uf(c.costoTotalUF, 0)}</div><span class="ayuda">${numero(c.costoTotalUF / e.propiedad.precioUF, 2)}× el precio</span></div>
        <div><span class="etiqueta">Plazo efectivo</span><div class="num" style="font-size:1.15rem">${anios(c.plazoMeses)}</div></div>
        <div><span class="etiqueta">Financiamiento</span><div class="num" style="font-size:1.15rem">${pct(c.ltv, 0)}</div><span class="ayuda">LTV</span></div>
      </div>`,
    })}

    ${r.prepago ? tarjeta({
      titulo: 'Tus abonos extraordinarios',
      descripcion: e.credito.modoAbono === 'plazo' ? 'En modo acortar plazo.' : 'En modo bajar dividendo.',
      contenido: `<div class="rejilla rejilla-3">
        <div><span class="etiqueta">Te ahorras</span><div class="num" style="font-size:1.15rem">${anios(r.prepago.mesesAhorrados)}</div></div>
        <div><span class="etiqueta">Interés que no pagas</span><div class="num" style="font-size:1.15rem">${uf(r.prepago.interesAhorradoUF, 0)}</div><span class="ayuda">${clp(r.prepago.interesAhorradoUF * vUF)}</span></div>
        <div><span class="etiqueta">Por cada UF abonada</span><div class="num" style="font-size:1.15rem">${numero(r.prepago.retornoPorUFAbonada, 2)} UF</div><span class="ayuda">de interés ahorrado</span></div>
      </div>`,
    }) : ''}

    <div class="rejilla rejilla-2" style="margin-top:var(--r4)">
      ${tarjetaFogaes}
      ${tarjetaSubsidio}
    </div>

    <div class="rejilla rejilla-2" style="margin-top:var(--r4)">

}

function montarResultado(cont, r) {

/* ====================================================================== */
/* 3. Comparar                                                             */
/* ====================================================================== */

function vistaComparar(r, estado) {
  const vUF = r.entrada.mercado.valorUF;
  const evaluados = estado.escenarios.map((s) => {
    try {
      return { id: s.id, nombre: s.entrada.propiedad.nombre || s.nombre, r: evaluarOperacion(s.entrada) };
    } catch (err) {
      return { id: s.id, nombre: s.entrada.propiedad.nombre || s.nombre, error: String(err.message || err) };
    }
  });
  const validos = evaluados.filter((e) => !e.error);

  const metricas = [
    { titulo: 'Precio', mejor: 'menor', v: (x) => x.r.entrada.propiedad.precioUF, f: (v) => uf(v, 0) },
    { titulo: 'Pie necesario', mejor: 'menor', v: (x) => x.r.credito.pieUF, f: (v) => uf(v, 0) },
    { titulo: 'Dividendo mes 1', mejor: 'menor', v: (x) => x.r.credito.dividendoPrimerMesUF, f: (v) => `${uf(v)}` },
    { titulo: 'Dividendo en pesos', mejor: 'menor', v: (x) => x.r.credito.dividendoPrimerMesUF * vUF, f: clp },
    { titulo: 'CAE', mejor: 'menor', v: (x) => x.r.credito.caeAnual, f: (v) => pct(v) },
    { titulo: 'Carga financiera', mejor: 'menor', v: (x) => x.r.ingresos.carga.valor, f: (v) => pct(v, 1) },
    { titulo: 'Interés total', mejor: 'menor', v: (x) => x.r.credito.totalInteresUF, f: (v) => uf(v, 0) },
    { titulo: 'Desembolso total', mejor: 'menor', v: (x) => x.r.credito.costoTotalUF, f: (v) => uf(v, 0) },
    { titulo: 'Cap rate neto', mejor: 'mayor', v: (x) => x.r.inversion?.capRateNeto, f: (v) => pct(v) },
    { titulo: 'Flujo mensual', mejor: 'mayor', v: (x) => x.r.inversion?.flujoMensualUF, f: (v) => uf(v) },
    { titulo: 'TIR proyectada', mejor: 'mayor', v: (x) => x.r.proyeccion?.tirAnual, f: (v) => pct(v) },
    { titulo: 'Señales rojas', mejor: 'menor', v: (x) => x.r.veredicto.conteo.rojo, f: (v) => String(v) },
  ];

  const puntajes = Object.fromEntries(validos.map((x) => [x.id, 0]));
  const filasHtml = metricas.map((m) => {
    const valores = validos.map((x) => ({ id: x.id, valor: m.v(x) }));
    const utiles = valores.filter((v) => typeof v.valor === 'number' && Number.isFinite(v.valor));
    let ganador = null;
    if (utiles.length > 1) {
      ganador = (m.mejor === 'mayor'
        ? utiles.reduce((a, b) => (b.valor > a.valor ? b : a))
        : utiles.reduce((a, b) => (b.valor < a.valor ? b : a))).id;
      puntajes[ganador] += 1;
    }
    const celdas = valores.map((v) => {
      const texto = (typeof v.valor === 'number' && Number.isFinite(v.valor)) ? m.f(v.valor) : '—';
      return `<td class="num"><span${v.id === ganador ? ' class="gana"' : ''}>${esc(texto)}</span></td>`;
    }).join('');
    return `<tr><td>${esc(m.titulo)}</td>${celdas}</tr>`;
  }).join('');

  const encabezados = validos.map((x) =>
    `<th class="num">${esc(x.nombre)}${x.id === estado.activoId ? ' <span class="chip liso">activo</span>' : ''}</th>`).join('');

  const mejor = Object.entries(puntajes).sort((a, b) => b[1] - a[1])[0];
  const nombreMejor = validos.find((x) => x.id === mejor?.[0])?.nombre;

  const vs = r.versusArrendar;

  return `
    ${validos.length < 2
      ? aviso('info', '<span>Tienes un solo escenario. Usa <strong>Duplicar</strong> arriba para clonarlo y cambiarle la tasa, el plazo o el precio, y compararlos aquí lado a lado.</span>')
      : ''}
    ${evaluados.filter((e) => e.error).map((e) => aviso('error', `<span><strong>${esc(e.nombre)}</strong> no se pudo calcular: ${esc(e.error)}</span>`)).join('')}

    ${validos.length >= 2 ? tarjeta({
      titulo: 'Escenario por escenario',
      descripcion: `Gana el que queda marcado en cada fila. ${nombreMejor ? `Con ${mejor[1]} de ${metricas.length} métricas, el que más gana es ${nombreMejor}.` : ''}`,
      contenido: `<div class="tabla-envoltorio"><table>
        <thead><tr><th></th>${encabezados}</tr></thead>
        <tbody>${filasHtml}</tbody>
      </table></div>
      <p class="ayuda" style="margin-top:var(--r3)">Ganar más filas no significa ser mejor: pesa según lo que a ti te importe. Un escenario que gana en dividendo pero pierde en carga financiera te puede quebrar igual.</p>`,
    }) : ''}

    ${vs ? tarjeta({
      titulo: 'Comprar contra arrendar e invertir la diferencia',
      descripcion: `Con plusvalía real de ${pct(vs.supuestos.plusvaliaAnualReal, 1)} al año y una alternativa que rinde ${pct(vs.supuestos.rendimientoAlternativoAnualReal, 1)} real.`,
      contenido: `
        <div id="gr-patrimonio"></div>
        ${aviso(vs.ganadorAlFinal === 'comprar' ? 'info' : 'alerta', `<span>
          Al año ${vs.serie.length}, <strong>${vs.ganadorAlFinal === 'comprar' ? 'comprar' : 'arrendar'} deja más patrimonio</strong>,
          por ${esc(uf(Math.abs(vs.diferenciaFinalUF), 0))} (${esc(clp(Math.abs(vs.diferenciaFinalUF) * vUF))}).
          ${vs.anioDeCruce ? `Comprar pasa adelante en el año ${esc(numero(vs.anioDeCruce, 1))}.` : 'Comprar no alcanza a arrendar en este horizonte.'}
        </span>`)}
        <p class="ayuda">Esta comparación es la más sensible de todas a la plusvalía y al rendimiento alternativo. Muévelos en Datos y mira cuánto cambia el veredicto antes de creerle.</p>`,
    }) : ''}`;
}

function montarComparar(cont, r) {
  const destino = cont.querySelector('#gr-patrimonio');
  if (destino && r.versusArrendar) {
    destino.append(graficoPatrimonio(r.versusArrendar.serie, {
      valorUF: r.entrada.mercado.valorUF,
      enPesos: false,
      anioDeCruce: r.versusArrendar.anioDeCruce,
    }));
  }
}

function vistaRiesgo(r) {
  const e = r.entrada;
  const vUF = e.mercado.valorUF;
  const ing = r.ingresos;
  const v = r.veredicto;

  const señalesHtml = v.señales.map(senal).join('');

  const est = ing.estadisticaBoletas;
  const tarjetaBoletas = est ? tarjeta({
    titulo: 'Tus ingresos, medidos',
    descripcion: `${est.meses} meses cargados.`,
    contenido: `<div class="rejilla rejilla-3">
        <div><span class="etiqueta">Promedio</span><div class="num" style="font-size:1.1rem">${clp(est.promedio)}</div></div>
        <div><span class="etiqueta">Mediana</span><div class="num" style="font-size:1.1rem">${clp(est.mediana)}</div></div>
        <div><span class="etiqueta">Variabilidad</span><div class="num" style="font-size:1.1rem">${pct(est.coefVariacion, 0)}</div></div>
        <div><span class="etiqueta">Mejor trimestre</span><div class="num" style="font-size:1.1rem">${clp(est.mejorTrimestrePromedioMensual)}</div><span class="ayuda">promedio mensual</span></div>
        <div><span class="etiqueta">Peor trimestre</span><div class="num" style="font-size:1.1rem">${clp(est.peorTrimestrePromedioMensual)}</div><span class="ayuda">cae ${pct(est.caidaPeorTrimestre, 0)} bajo tu promedio</span></div>
        <div><span class="etiqueta">Meses sin facturar</span><div class="num" style="font-size:1.1rem">${est.mesesEnCero}</div></div>
      </div>
      <p class="ayuda" style="margin-top:var(--r3)">El promedio es lo que mira el banco. El peor trimestre es lo que te puede dejar sin pagar el dividendo. Los dos importan, pero solo uno te quita la casa.</p>`,
  }) : tarjeta({
    titulo: 'Tus ingresos, medidos',
    contenido: aviso('info', '<span>Carga tus boletas de los últimos 12 a 24 meses en <strong>Datos → Tus ingresos</strong>. Con eso se calcula tu volatilidad real, tu peor trimestre y el colchón que te conviene tener.</span>'),
  });

  const ret = ing.retencion;
  const tarjetaRetencion = ret ? tarjeta({
    titulo: 'La retención sube todos los años',
    descripcion: RETENCION_HONORARIOS_FUENTE,
    contenido: `${tabla([
        { titulo: 'Año', num: false, obtener: (f) => String(f.anio) },
        { titulo: 'Retención', obtener: (f) => pct(f.tasaRetencion, 2) },
        { titulo: 'Te llega al mes', obtener: (f) => clp(f.liquidoRecibido) },
      ], ret.filas)}
      <p class="ayuda" style="margin-top:var(--r3)">Facturando exactamente lo mismo, en 2028 recibirás <strong>${clp(ret.caidaLiquidaMensual)} menos al mes</strong> que hoy. El dividendo, en cambio, no baja.</p>`,
  }) : '';

  const checklist = checklistIndependiente(e.perfil);
  const esIndep = e.perfil.modalidad === 'honorarios' || e.perfil.modalidad === 'mixto';
  const tarjetaChecklist = esIndep ? tarjeta({
    titulo: 'Lo que te va a pedir el banco',
    descripcion: 'Como independiente, la carpeta pesa tanto como la renta.',
    contenido: `<ul class="desglose">${checklist.map((c) => `<li>
        <span class="concepto"><strong>${esc(c.item)}</strong>${c.nota ? `<br><span class="ayuda">${esc(c.nota)}</span>` : ''}</span>
      </li>`).join('')}</ul>`,
  }) : '';

  return `
    ${aviso(v.conteo.rojo > 0 ? 'error' : v.conteo.ambar > 0 ? 'alerta' : 'info', `<span>${esc(v.resumen)}</span>`)}

    <div class="rejilla rejilla-2" style="margin-top:var(--r4)">${señalesHtml}</div>

    ${tarjeta({
      titulo: 'Qué supuesto mueve más tu dividendo',
      descripcion: 'Cada barra es cuánto cambia el dividendo si ese supuesto se mueve a un extremo razonable, dejando todo lo demás igual.',
      contenido: `<div id="gr-tornado"></div>
        <p class="ayuda" style="margin-top:var(--r3)">Lo que está arriba es donde vale la pena negociar. Lo que está abajo es ruido: no gastes energía ahí.</p>`,
      clase: 'plana',
    })}

    <div class="rejilla rejilla-2" style="margin-top:var(--r4)">
      ${tarjeta({
        titulo: 'Tu capacidad de pago',
        contenido: `<ul class="desglose">
          <li><span class="concepto">Renta que el banco te reconoce</span><span class="monto">${clp(ing.renta.total)}</span></li>
          <li><span class="concepto">Cupo total (${pct(e.perfil.cargaMaxima, 0)})</span><span class="monto">${clp(ing.capacidad.cupoTotal)}</span></li>
          <li><span class="concepto">Menos otras deudas</span><span class="monto">${clp(-ing.capacidad.otrasDeudasMensuales)}</span></li>
          <li class="total"><span class="concepto">Dividendo máximo</span><span class="monto">${clp(ing.capacidad.dividendoMaximo)}</span></li>
        </ul>
        <p class="ayuda" style="margin-top:var(--r3)">${esc(ing.renta.nota || '')}</p>
        <div class="rejilla rejilla-2" style="margin-top:var(--r4)">
          <div><span class="etiqueta">Precio máximo que alcanzas</span><div class="num" style="font-size:1.2rem">${uf(ing.alcance.precioMaximoUF, 0)}</div><span class="ayuda">${clp(ing.alcance.precioMaximoUF * vUF)}</span></div>
          <div><span class="etiqueta">Pie que necesitarías</span><div class="num" style="font-size:1.2rem">${uf(ing.alcance.pieNecesarioUF, 0)}</div><span class="ayuda">${clp(ing.alcance.pieNecesarioUF * vUF)}</span></div>
        </div>`,
      })}
      ${tarjetaBoletas}
    </div>

    <div class="rejilla rejilla-2" style="margin-top:var(--r4)">
      ${tarjetaRetencion}
      ${tarjetaChecklist}
    </div>`;
}

function montarRiesgo(cont, r) {
  const destino = cont.querySelector('#gr-tornado');
  if (destino) {
    destino.append(graficoTornado(r.sensibilidad.filas, r.sensibilidad.base, {
      valorUF: r.entrada.mercado.valorUF,
      enPesos: false,
    }));
  }
}

/* ====================================================================== */
/* 5. Tabla de amortización                                                */
/* ====================================================================== */

function vistaTabla(r, estado) {
  const vUF = r.entrada.mercado.valorUF;
  const enPesos = estado.tablaEnPesos === true;
  const f = (v) => (enPesos ? clp(v * vUF) : ufCorto(v));
  const filas = r.credito.filas;
  const soloAnual = estado.tablaAnual !== false;
  const mostradas = soloAnual ? filas.filter((x) => x.mes % 12 === 0) : filas;

  return `
    ${tarjeta({
      titulo: 'Mes a mes',
      descripcion: 'Cómo se reparte cada pago entre interés y capital, y cuánto debes en cada momento.',
      contenido: `
        <div class="acciones" style="margin-bottom:var(--r3)">
          <div class="segmentado" role="group" aria-label="Detalle de la tabla">
            <button type="button" data-accion="tabla-anual" aria-pressed="${soloAnual}">Cierre de cada año</button>
            <button type="button" data-accion="tabla-mensual" aria-pressed="${!soloAnual}">Todos los meses</button>
          </div>
          <div class="segmentado" role="group" aria-label="Unidad">
            <button type="button" data-accion="tabla-uf" aria-pressed="${!enPesos}">UF</button>
            <button type="button" data-accion="tabla-clp" aria-pressed="${enPesos}">Pesos</button>
          </div>
          <button type="button" class="boton" data-accion="exportar-csv">Descargar CSV</button>
        </div>
        <div id="gr-amortizacion"></div>`,
      clase: 'plana',
    })}

    <div style="margin-top:var(--r4)">
      ${tabla([
        { titulo: 'Mes', num: false, obtener: (x) => String(x.mes) },
        { titulo: 'Año', obtener: (x) => String(Math.ceil(x.mes / 12)) },
        { titulo: 'Dividendo', obtener: (x) => f(x.dividendoUF) },
        { titulo: 'Interés', obtener: (x) => f(x.interes) },
        { titulo: 'Capital', obtener: (x) => f(x.amortizacion) },
        { titulo: 'Seguros', obtener: (x) => f(x.segurosUF) },
        { titulo: 'Abono', obtener: (x) => (x.abonoExtra > 0 ? f(x.abonoExtra) : '—') },
        { titulo: 'Saldo', obtener: (x) => f(x.saldo) },
      ], mostradas)}
    </div>
    <p class="ayuda" style="margin-top:var(--r3)">${mostradas.length} de ${filas.length} meses. Los montos en UF son reales: no incluyen inflación porque la UF ya la absorbe.</p>`;
}

function montarTabla(cont, r, estado) {
  const destino = cont.querySelector('#gr-amortizacion');
  if (destino) {
    destino.append(graficoAmortizacion(r.credito.filas, {
      valorUF: r.entrada.mercado.valorUF,
      enPesos: estado.tablaEnPesos === true,
    }));
  }
}

/* ====================================================================== */
/* 6. Supuestos                                                            */
/* ====================================================================== */

function vistaSupuestos(r) {
  const filas = Object.entries(SUPUESTOS).map(([clave, s]) => ({ clave, ...s }));
  const porConfianza = { alta: [], media: [], baja: [] };
  for (const f of filas) porConfianza[f.confianza].push(f);

  const seccion = (nivel, titulo, descripcion) => tarjeta({
    titulo,
    descripcion,
    contenido: `<ul class="desglose">${porConfianza[nivel].map((s) => `<li>
        <span class="concepto"><strong>${esc(s.etiqueta)}</strong><br>
          <span class="ayuda">${esc(s.fuente)}${s.nota ? ` — ${esc(s.nota)}` : ''}</span></span>
        <span class="monto">${insigniaConfianza(s.confianza)}</span>
      </li>`).join('')}</ul>`,
  });

  return `
    ${aviso('info', `<span>Todos los parámetros se verificaron al <strong>${esc(VERIFICADO_AL)}</strong>. Ninguno está fijo en el código: todos se pueden editar en la pestaña Datos.</span>`)}

    <div class="rejilla" style="margin-top:var(--r4)">
      ${seccion('alta', 'Están en la ley o los publica el Banco Central', 'Cámbialos solo si la norma cambió.')}
      ${seccion('media', 'Varían entre bancos y perfiles', 'El valor por defecto es un punto medio razonable. Reemplázalo con tu cotización.')}
      ${seccion('baja', 'Cotiza estos antes de decidir', 'Varían tanto que el valor por defecto es apenas un orden de magnitud.')}
    </div>

    ${tarjeta({
      titulo: 'Cómo verificar que los números están bien',
      contenido: `
        <p>El motor de cálculo tiene 127 pruebas automáticas, incluida una que valida los tramos del Global Complementario contra las rebajas oficiales publicadas por el SII. Aun así, conviene que contrastes tu caso concreto:</p>
        <ol style="padding-left:1.2em; font-size:0.88rem; color:var(--tinta-2); line-height:1.7">
          <li>Simula el mismo crédito en el sitio de dos bancos (BancoEstado y Santander publican simuladores abiertos).</li>
          <li>Compara la <strong>cuota</strong>, no el dividendo: los simuladores casi nunca incluyen seguros.</li>
          <li>Si la diferencia supera el 1%, cambia la convención de tasa entre nominal y efectiva en Datos → El crédito. Esa es la causa en la mayoría de los casos.</li>
          <li>Si aun así no calza, ajusta las tarifas de seguros y gastos con las de tu cotización.</li>
        </ol>`,
    })}

    ${tarjeta({
      titulo: 'Tus datos',
      contenido: `
        <p>Todo lo que escribes se guarda solo en este navegador. La aplicación no tiene servidor, no envía nada a ninguna parte y funciona sin conexión.</p>
        <div class="acciones">
          <button type="button" class="boton" data-accion="exportar-json">Exportar todo (JSON)</button>
          <button type="button" class="boton" data-accion="importar-json">Importar</button>
          <button type="button" class="boton peligro" data-accion="borrar-todo">Borrar todo</button>
        </div>`,
    })}`;
}

/* ===== src/ui/app.js ===== */
/**
 * Arranque y cableado.
 *
 * La pestaña Datos se construye una sola vez y sus campos quedan como DOM no
 * controlado: así no pierdes el foco ni el cursor mientras escribes. Todo lo
 * demás es salida pura y se vuelve a dibujar en cada cambio.
 */








const PESTANAS = [
  { id: 'datos', texto: 'Datos' },
  { id: 'resultado', texto: 'Resultado' },
  { id: 'comparar', texto: 'Comparar' },
  { id: 'riesgo', texto: 'Riesgo' },
  { id: 'tabla', texto: 'Amortización' },
  { id: 'supuestos', texto: 'Supuestos' },
];

let estado = cargar();
let ultimoResultado = null;
let temporizador = null;

/* ---------------------------------------------------------------- */
/* Estructura fija                                                    */
/* ---------------------------------------------------------------- */

function construirEsqueleto() {
  document.body.innerHTML = `
    <header class="cabecera">
      <div class="cabecera-fila">
        <div class="marca">
          <h1>Dividendo &amp; Decisión</h1>
          <span class="sub">Chile · 2026</span>
        </div>
        <div class="uf-control">
          <label for="valor-uf">UF</label>
          <input id="valor-uf" data-ruta="mercado.valorUF" data-tipo="clp" inputmode="decimal">
          <span class="fecha">al ${esc(SUPUESTOS.valorUF.fuente.split(', ').pop())}</span>
        </div>
      </div>
      <div class="resumen" data-salida="resumen"></div>
    </header>

    <nav class="pestanas" aria-label="Secciones">
      <div class="pestanas-fila" role="tablist">
        ${PESTANAS.map((p) => `<button class="pestana" role="tab" id="tab-${p.id}"
          aria-controls="panel-${p.id}" aria-selected="false" data-pestana="${p.id}">${esc(p.texto)}</button>`).join('')}
      </div>
    </nav>

    <main>
      <div class="acciones" style="margin-bottom:var(--r4)" data-salida="escenarios"></div>
      ${PESTANAS.map((p) => `<section id="panel-${p.id}" role="tabpanel" aria-labelledby="tab-${p.id}" hidden
        ${p.id === 'datos' ? '' : `data-salida="${p.id}"`}></section>`).join('')}
    </main>

    <footer class="pie-legal">
      <p><strong>Esto es una herramienta de decisión, no asesoría financiera ni una preaprobación.</strong>
      Los seguros, los gastos operacionales y el castigo de renta varían de forma significativa entre bancos y
      solo quedan fijos con una cotización formal. Ninguna cifra acá compromete a ninguna institución.</p>
      <p>Los cálculos corren enteros en tu navegador. No hay servidor, no se envía nada a ninguna parte,
      y lo que guardas se queda en este dispositivo. Parámetros verificados al ${esc(SUPUESTOS.valorUF.fuente.split(', ').pop())}.</p>
    </footer>`;

  document.getElementById('panel-datos').innerHTML = vistaDatos();
}

/* ---------------------------------------------------------------- */
/* Enlace de campos                                                   */
/* ---------------------------------------------------------------- */

function aTexto(valor, tipo) {
  if (valor == null) return '';
  switch (tipo) {
    case 'pct': return numero(valor * 100, valor * 100 % 1 === 0 ? 0 : 2);
    case 'pctFino': return (valor * 100).toLocaleString('es-CL', { maximumFractionDigits: 4 });
    case 'clp': return Math.round(valor).toLocaleString('es-CL');
    case 'uf': return numero(valor, valor % 1 === 0 ? 0 : 2);
    case 'numero': return String(valor);
    case 'lista': return Array.isArray(valor) ? valor.map((v) => Math.round(v)).join(', ') : '';
    default: return String(valor);
  }
}

function desdeTexto(texto, tipo) {
  switch (tipo) {
    case 'pct':
    case 'pctFino': return aNumero(texto) / 100;
    case 'clp':
    case 'uf':
    case 'numero': return aNumero(texto);
    case 'lista':
      return String(texto).split(/[,;\n]+/).map((t) => aNumero(t)).filter((n) => Number.isFinite(n) && n !== 0);
    default: return texto;
  }
}

/** Vuelca el estado a los campos. Se llama al arrancar y al cambiar de escenario. */
function sincronizarCampos() {
  const entrada = escenarioActivo(estado).entrada;
  for (const nodo of document.querySelectorAll('[data-ruta]')) {
    const ruta = nodo.dataset.ruta;
    const tipo = nodo.dataset.tipo;
    const valor = leerRuta(entrada, ruta);
    if (tipo === 'bool') nodo.checked = Boolean(valor);
    else if (document.activeElement !== nodo) nodo.value = aTexto(valor, tipo);
  }
  actualizarEquivalentes();
}

/** Muestra el equivalente en pesos junto a cada campo en UF. */
function actualizarEquivalentes() {
  const entrada = escenarioActivo(estado).entrada;
  const vUF = entrada.mercado.valorUF || 0;
  for (const nodo of document.querySelectorAll('[data-equivalente]')) {
    const valor = leerRuta(entrada, nodo.dataset.equivalente);
    nodo.textContent = Number.isFinite(valor) && valor > 0 ? clp(valor * vUF) : '';
  }
}

function alEscribir(ev) {
  const nodo = ev.target.closest('[data-ruta]');
  if (!nodo) return;
  const entrada = escenarioActivo(estado).entrada;
  const tipo = nodo.dataset.tipo;
  const valor = tipo === 'bool' ? nodo.checked : desdeTexto(nodo.value, tipo);
  escribirRuta(entrada, nodo.dataset.ruta, valor);
  if (nodo.dataset.ruta === 'propiedad.nombre') {
    escenarioActivo(estado).nombre = valor;
  }
  programarActualizacion();
}

function programarActualizacion() {
  clearTimeout(temporizador);
  temporizador = setTimeout(() => {
    actualizar();
    guardar(estado);
  }, 140);
}

/* ---------------------------------------------------------------- */
/* Render de salidas                                                  */
/* ---------------------------------------------------------------- */

function actualizar() {
  const activo = escenarioActivo(estado);
  let r;
  try {
    r = evaluarOperacion(activo.entrada);
    ultimoResultado = r;
  } catch (err) {
    document.querySelector('[data-salida="resumen"]').innerHTML =
      `<div class="aviso error">No se puede calcular con estos datos: ${esc(err.message)}</div>`;
    return;
  }

  actualizarEquivalentes();
  renderResumen(r);
  renderEscenarios();

  const vistas = {
    resultado: () => vistaResultado(r, estado),
    comparar: () => vistaComparar(r, estado),
    riesgo: () => vistaRiesgo(r),
    tabla: () => vistaTabla(r, estado),
    supuestos: () => vistaSupuestos(r),
  };
  const montajes = {
    resultado: montarResultado, comparar: montarComparar,
    riesgo: montarRiesgo, tabla: montarTabla,
  };

  // Solo se dibuja la pestaña visible: el resto se dibuja al abrirla.
  const actual = estado.pestana;
  if (vistas[actual]) {
    const panel = document.getElementById(`panel-${actual}`);
    panel.innerHTML = vistas[actual]();
    montajes[actual]?.(panel, r, estado);
  }
}

function renderResumen(r) {
  const vUF = r.entrada.mercado.valorUF;
  const c = r.credito;
  const carga = r.ingresos.carga;
  const inv = r.inversion;

  const chips = [
    carga.valor != null ? chip(carga.semaforo, `Carga ${pct(carga.valor, 1)}`) : chip('sin-dato', 'Carga sin dato'),
    inv ? chip(inv.flujoMensualUF >= 0 ? 'verde' : 'rojo',
      `Flujo ${inv.flujoMensualUF >= 0 ? '+' : ''}${uf(inv.flujoMensualUF)}`) : '',
    r.veredicto.conteo.rojo > 0
      ? chip('rojo', `${r.veredicto.conteo.rojo} ${r.veredicto.conteo.rojo === 1 ? 'señal roja' : 'señales rojas'}`)
      : chip('verde', 'Sin señales rojas'),
  ].filter(Boolean).join('');

  document.querySelector('[data-salida="resumen"]').innerHTML = `
    <div class="resumen-cifra">
      <span class="etiqueta">Dividendo mes 1</span>
      <span class="valor">${esc(clp(c.dividendoPrimerMesUF * vUF))}</span>
      <span class="pie">${esc(uf(c.dividendoPrimerMesUF))} · CAE ${esc(pct(c.caeAnual))}</span>
    </div>
    <div class="resumen-cifra">
      <span class="etiqueta">Necesitas al firmar</span>
      <span class="valor chico">${esc(clp((c.pieUF + c.gastosOperacionales.desembolsoInicialUF) * vUF))}</span>
      <span class="pie">${esc(uf(c.pieUF + c.gastosOperacionales.desembolsoInicialUF, 0))}</span>
    </div>
    <div class="resumen-chips">${chips}</div>`;
}

function renderEscenarios() {
  const cont = document.querySelector('[data-salida="escenarios"]');
  const botones = estado.escenarios.map((s) => {
    const activo = s.id === estado.activoId;
    return `<button type="button" class="boton${activo ? ' primario' : ''}" data-escenario="${s.id}">
      ${esc(s.entrada.propiedad.nombre || s.nombre)}</button>`;
  }).join('');
  cont.innerHTML = `${botones}
    <button type="button" class="boton" data-accion="nuevo-escenario">+ Nuevo</button>
    <button type="button" class="boton" data-accion="duplicar-escenario">Duplicar</button>
    ${estado.escenarios.length > 1 ? '<button type="button" class="boton peligro" data-accion="eliminar-escenario">Eliminar</button>' : ''}`;
}

/* ---------------------------------------------------------------- */
/* Pestañas                                                           */
/* ---------------------------------------------------------------- */

function irA(pestana) {
  estado.pestana = pestana;
  ocultarGlobo();
  for (const p of PESTANAS) {
    const tab = document.getElementById(`tab-${p.id}`);
    const panel = document.getElementById(`panel-${p.id}`);
    const activo = p.id === pestana;
    tab.setAttribute('aria-selected', String(activo));
    panel.hidden = !activo;
  }
  actualizar();
  guardar(estado);
}

/* ---------------------------------------------------------------- */
/* Acciones                                                           */
/* ---------------------------------------------------------------- */

/**
 * Descarga de archivos por dos caminos.
 *
 * Abierta como archivo suelto, basta un enlace con `download`. Publicada, el
 * visor no le da a la página permiso de descarga y ese enlace no hace nada,
 * así que hay que pedírselo al anfitrión. Se intenta primero el camino del
 * anfitrión y se cae al local, para que el mismo archivo sirva en los dos casos.
 */
let capacidadDescargas;

async function resolverDescargas() {
  if (capacidadDescargas !== undefined) return capacidadDescargas;
  try {
    capacidadDescargas = window.claude?.use ? await window.claude.use('downloads') : null;
  } catch {
    capacidadDescargas = null;
  }
  return capacidadDescargas;
}

function avisar(texto) {
  let nodo = document.querySelector('.mensaje-flotante');
  if (!nodo) {
    nodo = document.createElement('div');
    nodo.className = 'mensaje-flotante';
    nodo.setAttribute('role', 'status');
    document.body.append(nodo);
  }
  nodo.textContent = texto;
  nodo.hidden = false;
  clearTimeout(avisar.temporizador);
  avisar.temporizador = setTimeout(() => { nodo.hidden = true; }, 4000);
}

function descargarLocal(nombre, contenido, tipo) {
  const blob = new Blob([contenido], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nombre;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function descargar(nombre, contenido, tipo) {
  const descargas = await resolverDescargas();
  if (descargas) {
    try {
      await descargas.save({ filename: nombre, data: contenido });
      return;
    } catch (err) {
      const codigo = err?.code;
      if (codigo === 'declined') return; // dijiste que no: no hay nada que hacer
      if (codigo === 'rate_limited') {
        avisar('Hay otra descarga esperando confirmación. Inténtalo en unos segundos.');
        return;
      }
      if (codigo === 'too_large') {
        avisar('El archivo pasa el límite de 16 MB.');
        return;
      }
      // Cualquier otra cosa: queda el camino local.
    }
  }
  descargarLocal(nombre, contenido, tipo);
}

function exportarCSV() {
  if (!ultimoResultado) return;
  const vUF = ultimoResultado.entrada.mercado.valorUF;
  const cabecera = ['mes', 'anio', 'dividendo_uf', 'interes_uf', 'capital_uf', 'seguros_uf', 'abono_uf', 'saldo_uf', 'dividendo_clp'];
  const filas = ultimoResultado.credito.filas.map((f) => [
    f.mes, Math.ceil(f.mes / 12),
    f.dividendoUF.toFixed(4), f.interes.toFixed(4), f.amortizacion.toFixed(4),
    f.segurosUF.toFixed(4), f.abonoExtra.toFixed(4), f.saldo.toFixed(4),
    Math.round(f.dividendoUF * vUF),
  ].join(','));
  descargar('amortizacion.csv', [cabecera.join(','), ...filas].join('\n'), 'text/csv;charset=utf-8');
}

function exportarJSON() {
  descargar('calculadora-hipotecaria.json', JSON.stringify({
    version: 1,
    exportadoEl: new Date().toISOString(),
    escenarios: estado.escenarios,
  }, null, 2), 'application/json');
}

function importarJSON() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.addEventListener('change', async () => {
    const archivo = input.files?.[0];
    if (!archivo) return;
    try {
      const datos = JSON.parse(await archivo.text());
      if (!Array.isArray(datos.escenarios) || !datos.escenarios.length) {
        throw new Error('El archivo no trae escenarios.');
      }
      estado.escenarios = datos.escenarios;
      estado.activoId = datos.escenarios[0].id;
      guardar(estado);
      sincronizarCampos();
      renderEscenarios();
      actualizar();
    } catch (err) {
      avisar(`No se pudo importar: ${err.message}`);
    }
  });
  input.click();
}

function alHacerClic(ev) {
  const pestana = ev.target.closest('[data-pestana]');
  if (pestana) return irA(pestana.dataset.pestana);

  const escenario = ev.target.closest('[data-escenario]');
  if (escenario) {
    estado.activoId = escenario.dataset.escenario;
    sincronizarCampos();
    actualizar();
    guardar(estado);
    return;
  }

  const accion = ev.target.closest('[data-accion]')?.dataset.accion;
  if (!accion) return;

  switch (accion) {
    case 'nuevo-escenario':
      estado = agregarEscenario(estado);
      sincronizarCampos(); actualizar(); guardar(estado);
      break;
    case 'duplicar-escenario':
      estado = duplicarEscenario(estado, estado.activoId);
      sincronizarCampos(); actualizar(); guardar(estado);
      break;
    case 'eliminar-escenario':
      if (confirm('¿Eliminar este escenario?')) {
        estado = eliminarEscenario(estado, estado.activoId);
        sincronizarCampos(); actualizar(); guardar(estado);
      }
      break;
    case 'tabla-anual': estado.tablaAnual = true; actualizar(); break;
    case 'tabla-mensual': estado.tablaAnual = false; actualizar(); break;
    case 'tabla-uf': estado.tablaEnPesos = false; actualizar(); break;
    case 'tabla-clp': estado.tablaEnPesos = true; actualizar(); break;
    case 'exportar-csv': exportarCSV(); break;
    case 'exportar-json': exportarJSON(); break;
    case 'importar-json': importarJSON(); break;
    case 'borrar-todo':
      if (confirm('Se borra todo lo que guardaste en este navegador. ¿Seguro?')) {
        limpiar();
        location.reload();
      }
      break;
  }
}

/* ---------------------------------------------------------------- */

function iniciar() {
  construirEsqueleto();
  sincronizarCampos();
  // Se resuelve de entrada: `use()` puede tardar hasta 10 s en decidir que no
  // hay anfitrión, y eso no se puede pagar en medio de un clic.
  resolverDescargas();

  document.addEventListener('input', alEscribir);
  document.addEventListener('change', alEscribir);
  document.addEventListener('click', alHacerClic);
  // Al salir de un campo numérico, se reformatea a la convención chilena.
  document.addEventListener('focusout', (ev) => {
    const nodo = ev.target.closest('[data-ruta]');
    if (!nodo || nodo.dataset.tipo === 'texto' || nodo.dataset.tipo === 'bool') return;
    const entrada = escenarioActivo(estado).entrada;
    nodo.value = aTexto(leerRuta(entrada, nodo.dataset.ruta), nodo.dataset.tipo);
  });

  irA(estado.pestana && PESTANAS.some((p) => p.id === estado.pestana) ? estado.pestana : 'datos');
}

iniciar();
</script>
